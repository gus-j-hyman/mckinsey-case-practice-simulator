<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McKinsey Style Case Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        mckinsey: { navy: '#051c2c', blue: '#005f9e', slate: '#334155', accent: '#e06b20' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; }
        .reveal-content { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .reveal-content.open { max-height: 3000px; padding-top: 1rem; padding-bottom: 1rem; }
        .markdown-table { width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
        .markdown-table th { background-color: #051c2c; color: white; padding: 0.75rem; text-align: left; border: 1px solid #e2e8f0; font-weight: 600; }
        .markdown-table td { padding: 0.75rem; border: 1px solid #e2e8f0; color: #334155; }
        .markdown-table tr:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body class="text-gray-900 antialiased flex flex-col min-h-screen bg-[#f4f6f8]">

    <nav class="bg-mckinsey-navy text-white py-4 px-6 border-b border-gray-800 shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-6 bg-mckinsey-blue"></div>
                <span class="text-sm font-bold uppercase tracking-widest text-gray-100">McKinsey Style Case Bot</span>
            </div>
            <span class="text-xs font-mono text-mckinsey-blue bg-slate-900/80 px-3 py-1 rounded border border-slate-800 font-semibold">AI Deployment Environment</span>
        </div>
    </nav>

    <header class="max-w-5xl w-full mx-auto mt-8 px-4">
        <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
            <h1 class="text-lg font-bold text-mckinsey-navy mb-4 flex items-center">
                <span class="w-2 h-2 bg-mckinsey-blue rounded-full mr-2"></span>
                Case Strategy Parameters
            </h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Target Industry Vertical</label>
                    <select id="industry-select" class="w-full bg-white border border-gray-300 rounded p-2.5 text-sm font-medium text-gray-800 focus:ring-1 focus:ring-mckinsey-blue outline-none cursor-pointer">
                        <option value="Aerospace & Defense">Aerospace & Defense</option>
                        <option value="Automotive & Assembly">Automotive & Assembly</option>
                        <option value="Advanced Electronics">Advanced Electronics</option>
                        <option value="Agriculture">Agriculture</option>
                        <option value="Chemicals">Chemicals</option>
                        <option value="Consumer Packaged Goods (CPG)">Consumer Packaged Goods (CPG)</option>
                        <option value="Capital Projects & Infrastructure">Capital Projects & Infrastructure</option>
                        <option value="Electric Power & Natural Gas">Electric Power & Natural Gas</option>
                        <option value="Retail Banking">Retail Banking</option>
                        <option value="Asset Management">Asset Management</option>
                        <option value="Wealth Management">Wealth Management</option>
                        <option value="Healthcare Systems & Services">Healthcare Systems & Services</option>
                        <option value="Medical Devices">Medical Devices</option>
                        <option value="Pharmaceuticals">Pharmaceuticals</option>
                        <option value="Biotechnology">Biotechnology</option>
                        <option value="High Tech & Semiconductors">High Tech & Semiconductors</option>
                        <option value="Media & Entertainment">Media & Entertainment</option>
                        <option value="Telecommunications">Telecommunications</option>
                        <option value="Metals & Mining">Metals & Mining</option>
                        <option value="Oil & Gas">Oil & Gas</option>
                        <option value="Pulp & Paper">Pulp & Paper</option>
                        <option value="National Security">National Security</option>
                        <option value="Public Sector Education">Public Sector Education</option>
                        <option value="Economic Development">Economic Development</option>
                        <option value="Global Health NGOs">Global Health NGOs</option>
                        <option value="Real Estate">Real Estate</option>
                        <option value="E-commerce">E-commerce</option>
                        <option value="Brick & Mortar Retail">Brick & Mortar Retail</option>
                        <option value="Apparel & Luxury Goods">Apparel & Luxury Goods</option>
                        <option value="Travel & Logistics">Travel & Logistics</option>
                        <option value="Hospitality">Hospitality</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Strategic Case Type</label>
                    <select id="type-select" class="w-full bg-white border border-gray-300 rounded p-2.5 text-sm font-medium text-gray-800 focus:ring-1 focus:ring-mckinsey-blue outline-none cursor-pointer">
                        <option value="Market Entry Strategy">Market Entry Strategy</option>
                        <option value="New Product/Service Launch">New Product/Service Launch</option>
                        <option value="Profitability Optimization (Revenue Side)">Profitability Optimization (Revenue Side)</option>
                        <option value="Profitability Optimization (Cost Side)">Profitability Optimization (Cost Side)</option>
                        <option value="M&A Due Diligence (Buy-Side)">M&A Due Diligence (Buy-Side)</option>
                        <option value="Post-Merger Operational Integration">Post-Merger Operational Integration</option>
                        <option value="Growth Strategy">Growth Strategy</option>
                        <option value="Digital Transformation & Automation">Digital Transformation & Automation</option>
                        <option value="Capital Investment/Asset Renewal Optimization">Capital Investment/Asset Renewal Optimization</option>
                        <option value="Supply Chain & Logistics Resilience">Supply Chain & Logistics Resilience</option>
                        <option value="Competitive Threat Response">Competitive Threat Response</option>
                        <option value="Regulatory/Tariff Compliance Strategy">Regulatory/Tariff Compliance Strategy</option>
                        <option value="Pricing & Monetization Optimization">Pricing & Monetization Optimization</option>
                        <option value="Sustainability/Decarbonization Transition">Sustainability/Decarbonization Transition</option>
                        <option value="Turnaround/Restructuring of Distressed Business">Turnaround/Restructuring of Distressed Business</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="executeCaseGenerationEngine()" class="w-full bg-mckinsey-blue hover:bg-blue-800 text-white font-semibold text-xs py-3 px-4 rounded shadow-sm transition duration-150 uppercase tracking-widest">
                        Generate Custom Case Model
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main id="workspace" class="max-w-5xl w-full mx-auto mt-8 px-4 mb-24 hidden">
        </main>

    <script>
        let globalChartInstance = null;

        function toggleAnswerContainer(id) {
            const content = document.getElementById(id);
            const indicator = document.getElementById('ind-' + id);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                indicator.innerHTML = '&#9662;';
            } else {
                content.classList.add('open');
                indicator.innerHTML = '&#9652;';
            }
        }

        function executeCaseGenerationEngine() {
            const industry = document.getElementById('industry-select').value;
            const caseType = document.getElementById('type-select').value;
            const workspace = document.getElementById('workspace');
            
            // Safe Chart Destruction
            if (globalChartInstance) { 
                globalChartInstance.destroy(); 
                globalChartInstance = null;
            }
            
            workspace.classList.remove('hidden');
            const data = generateCasePayload(industry, caseType);
            
            // Build Markdown Table if present
            let exhibitHtml = '';
            if (data.q3.dataTable) {
                exhibitHtml += `
                    <div class="overflow-x-auto mb-6">
                        <table class="markdown-table">
                            <thead><tr>${data.q3.dataTable.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                            <tbody>${data.q3.dataTable.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
                        </table>
                    </div>
                `;
            }

            workspace.innerHTML = `
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="bg-mckinsey-navy text-white p-6 border-b border-gray-800">
                        <span class="text-xs font-bold uppercase tracking-widest text-mckinsey-blue block mb-1">${data.industry} | ${data.caseType}</span>
                        <h2 class="text-3xl font-bold tracking-tight">${data.brandName}</h2>
                    </div>
                    <div class="p-8 space-y-6">
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-mckinsey-navy mb-1">Client Goal</h3>
                            <p class="text-base font-semibold text-gray-900">${data.clientGoal}</p>
                        </div>
                        <hr class="border-gray-100" />
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-mckinsey-navy mb-2">Situation Description</h3>
                            <div class="text-sm text-gray-700 leading-relaxed space-y-4">
                                <p>${data.p1}</p>
                                <p>${data.p2}</p>
                                <p>${data.p3}</p>
                            </div>
                        </div>
                        <hr class="border-gray-100" />
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-mckinsey-navy mb-2">McKinsey Study</h3>
                            <div class="bg-slate-50 border-l-4 border-mckinsey-navy p-4 text-sm font-medium text-mckinsey-navy italic rounded-r">
                                ${data.mckinseyStudy}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mb-8">
                    <h2 class="text-xl font-bold text-gray-800 uppercase tracking-widest">Practice Case Questions</h2>
                    <div class="w-16 h-1 bg-mckinsey-blue mx-auto mt-3"></div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 1: Qualitative Framework</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-mckinsey-navy mb-6">${data.q1.prompt}</h3>
                        <button onclick="toggleAnswerContainer('ans-1')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50 transition bg-white shadow-sm">
                            <span>Reveal Ideal Answer Rubric</span>
                            <span id="ind-ans-1" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-1" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 space-y-4 p-6">
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    ${data.q1.pillars.map(p => `
                                        <div>
                                            <h4 class="font-bold text-mckinsey-blue mb-2 border-b border-blue-100 pb-1">${p.title}</h4>
                                            <ul class="list-disc pl-4 space-y-1 text-xs text-slate-700">
                                                ${p.bullets.map(b => `<li>${b}</li>`).join('')}
                                            </ul>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 2: Quantitative Analysis</span>
                    </div>
                    <div class="p-8">
                        <div class="text-lg font-bold text-mckinsey-navy mb-4 space-y-3">${data.q2.prompt}</div>
                        <div class="mb-6 p-3 bg-blue-50 border border-blue-100 text-mckinsey-blue text-xs font-semibold rounded">
                            Helpful hint: Calculators are not allowed—you may want to write out your calculations on paper.
                        </div>
                        <button onclick="toggleAnswerContainer('ans-2')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50 transition bg-white shadow-sm">
                            <span>Reveal Calculation Steps</span>
                            <span id="ind-ans-2" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-2" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 p-6 space-y-4">
                                <ul class="list-decimal pl-5 space-y-2 text-sm text-slate-700">
                                    ${data.q2.steps.map(s => `<li>${s}</li>`).join('')}
                                </ul>
                                <div class="mt-4 p-4 bg-mckinsey-navy text-white font-bold rounded">
                                    Final Answer: ${data.q2.answer}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 3: Data Interpretation</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-mckinsey-navy mb-6">${data.q3.prompt}</h3>
                        <div class="w-full bg-white p-6 rounded border border-gray-200 shadow-inner mb-6">
                            ${exhibitHtml}
                            <div class="w-full h-[380px] relative">
                                <canvas id="canvasRenderZone"></canvas>
                            </div>
                        </div>
                        <button onclick="toggleAnswerContainer('ans-3')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50 transition bg-white shadow-sm">
                            <span>Reveal Data Insights</span>
                            <span id="ind-ans-3" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-3" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 p-6 space-y-4">
                                <div><h4 class="font-bold text-red-600 mb-1">Red Herring Identified:</h4><p>${data.q3.redHerring}</p></div>
                                <div><h4 class="font-bold text-mckinsey-accent mb-1">Hidden Correlation:</h4><p>${data.q3.correlation}</p></div>
                                <div><h4 class="font-bold text-mckinsey-blue mb-1">Core Takeaway:</h4><p>${data.q3.takeaway}</p></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 4: Brainstorm</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-mckinsey-navy mb-6">${data.q4.prompt}</h3>
                        <button onclick="toggleAnswerContainer('ans-4')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50 transition bg-white shadow-sm">
                            <span>Reveal Brainstorming Strategy</span>
                            <span id="ind-ans-4" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-4" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 p-6 space-y-6">
                                ${data.q4.rubric.map(r => `
                                    <div>
                                        <h4 class="font-bold text-mckinsey-navy uppercase tracking-wider text-xs mb-2 border-b pb-1">${r.theme}</h4>
                                        <ul class="list-disc pl-5 space-y-1 text-slate-700">
                                            ${r.bullets.map(b => `<li>${b}</li>`).join('')}
                                        </ul>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            renderDynamicChart(data.chart.type, data.chart.config);
            workspace.scrollIntoView({ behavior: 'smooth' });
        }

        function renderDynamicChart(type, config) {
            const ctx = document.getElementById('canvasRenderZone').getContext('2d');
            let chartJsConfig = {
                plugins: [{
                    beforeDraw: (chart) => {
                        const cCtx = chart.ctx;
                        cCtx.save();
                        cCtx.fillStyle = '#ffffff';
                        cCtx.fillRect(0, 0, chart.width, chart.height);
                        cCtx.restore();
                    }
                }],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: config.title, color: '#051c2c', font: { family: 'Inter', size: 14, weight: '700' }, padding: { bottom: 20 } },
                        legend: { display: true, position: 'bottom', labels: { font: { family: 'Inter', size: 11, weight: '500' }, color: '#334155' } }
                    }
                }
            };

            switch(type) {
                case 'waterfall':
                    chartJsConfig.type = 'bar';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { y: { title: { display: true, text: 'Variance Impact' } } };
                    break;
                case 'bubble':
                    chartJsConfig.type = 'bubble';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { x: { title: { display: true, text: config.xTitle || 'X Axis' } }, y: { title: { display: true, text: config.yTitle || 'Y Axis' } } };
                    break;
                case 'inverted':
                    chartJsConfig.type = 'line';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { y: { reverse: true, title: { display: true, text: 'Regression Metric (Lower is Optimal)' } } };
                    break;
                case 'dualAxis':
                    chartJsConfig.type = 'bar';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { y: { position: 'left' }, y1: { position: 'right', grid: { drawOnChartArea: false } } };
                    break;
                case 'stackedBar100':
                    chartJsConfig.type = 'bar';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { x: { stacked: true }, y: { stacked: true, max: 100, title: { display: true, text: '% Distribution' } } };
                    break;
                case 'scatter':
                    chartJsConfig.type = 'scatter';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { x: { title: { display: true, text: config.xTitle || 'X Axis' } }, y: { title: { display: true, text: config.yTitle || 'Y Axis' } } };
                    break;
                case 'doughnut':
                case 'polarArea':
                case 'radar':
                    chartJsConfig.type = type;
                    chartJsConfig.data = config.data;
                    break;
                default:
                    chartJsConfig.type = 'bar';
                    chartJsConfig.data = config.data;
                    if(config.stacked) {
                        chartJsConfig.options.scales = { x: { stacked: true }, y: { stacked: true } };
                    }
            }

            globalChartInstance = new Chart(ctx, chartJsConfig);
        }

        // --- PROCEDURAL GENERATION MATRIX ---
        function generateCasePayload(industry, caseType) {
            
            // 1. BRAND & DEMOGRAPHIC MATRIX
            const prefixes = ['Aethel', 'Velo', 'Nexa', 'Terra', 'Omni', 'Quantum', 'Lumina', 'Aero', 'Zephyr', 'Synapse', 'Calyx', 'Valiant', 'Strata', 'Equinox', 'Pinnacle', 'Aegis', 'Vanguard', 'Meridian'];
            const suffixes = ['Corp', 'Strat', 'Pharma', 'Lumen', 'Systems', 'Dynamics', 'Logistics', 'Networks', 'Tech', 'Holdings', 'Industries', 'Solutions', 'Global', 'Enterprises'];
            const brandName = prefixes[Math.floor(Math.random() * prefixes.length)] + suffixes[Math.floor(Math.random() * suffixes.length)];
            const sponsors = ['Chief Risk Officer', 'Head of Global Supply Chain', 'VP of Strategic Finance', 'Chief Operating Officer', 'EVP of Corporate Development', 'Chief Commercial Officer'];
            const sponsor = sponsors[Math.floor(Math.random() * sponsors.length)];

            // 2. CASE TYPE ALIGNMENT MATRIX (Resolves Requirement 1: 50+ unique issues per type dynamically)
            // We use combinatorial arrays to generate unique context tied explicitly to the Case Type.
            let caseTheme = "";
            let complication = "";
            let p1_strength = "";
            let p2_economics = "";

            if (caseType.includes("Market Entry") || caseType.includes("Launch") || caseType.includes("Growth")) {
                caseTheme = "ElectroLight"; // Market Share / Breakeven Focus
                const targets = ["the APAC region", "the EMEA mid-market", "a highly regulated Latin American corridor", "the emerging Gen-Z digital demographic"];
                const blockers = ["aggressive localized price wars", "unpredicted protectionist tariffs", "a lack of established distribution nodes", "severe cultural misalignment in marketing"];
                complication = `their recent attempt to penetrate ${targets[Math.floor(Math.random()*targets.length)]} has stalled due to ${blockers[Math.floor(Math.random()*blockers.length)]}.`;
                p1_strength = `commanding a dominant 40% market share in their domestic territory with a legacy cash-cow product line.`;
                p2_economics = `Their traditional model relies on high-margin, low-volume direct sales. However, expanding outward requires adopting a high-volume, lower-margin distribution architecture.`;
            } 
            else if (caseType.includes("Cost") || caseType.includes("Supply Chain") || caseType.includes("Turnaround") || caseType.includes("Asset")) {
                caseTheme = "Talbot"; // TCO / Cost Parity Focus
                const assets = ["legacy manufacturing hubs", "third-party logistics networks", "aging data centers", "cross-border procurement channels"];
                const threats = ["hyper-inflation of raw material costs", "unionized labor strikes", "geopolitical fragmentation", "rapidly decaying asset efficiency"];
                complication = `their ${assets[Math.floor(Math.random()*assets.length)]} are buckling under ${threats[Math.floor(Math.random()*threats.length)]}.`;
                p1_strength = `operating a dense, capital-intensive infrastructure footprint that historically acted as a massive barrier to entry.`;
                p2_economics = `Profitability is driven by heavy upfront CapEx amortized over 10-15 years. They must maintain a strict 92% utilization rate just to service their operational debt.`;
            }
            else if (caseType.includes("M&A") || caseType.includes("Integration") || caseType.includes("Digital")) {
                caseTheme = "GlobaPharm"; // Pipeline / Expected Value Focus
                const targets = ["a disruptive agile startup", "a distressed regional competitor", "a vertical supply-chain partner", "a cloud-native software vendor"];
                const risks = ["catastrophic cultural friction", "hidden technical debt in their codebase", "overlapping, redundant middle-management layers", "regulatory anti-trust scrutiny"];
                complication = `their ongoing integration of ${targets[Math.floor(Math.random()*targets.length)]} is bleeding capital due to ${risks[Math.floor(Math.random()*risks.length)]}.`;
                p1_strength = `possessing a massive balance sheet and a history of aggressively buying out emerging threats.`;
                p2_economics = `Their growth strategy is inorganic, relying on acquiring smaller players and plugging them into a massive, global distribution engine to instantly scale revenue.`;
            }
            else {
                caseTheme = "Diconsa"; // Population / Survey / Segment focus
                const segments = ["enterprise B2B clients", "rural populations", "high-net-worth individuals", "government agencies"];
                const shifts = ["a sudden migration to open-source alternatives", "drastic cuts in localized subsidization", "a demographic shift aging out of their core product", "a sudden demand for absolute carbon neutrality"];
                complication = `their core demographic of ${segments[Math.floor(Math.random()*segments.length)]} is rapidly churning due to ${shifts[Math.floor(Math.random()*shifts.length)]}.`;
                p1_strength = `boasting an incredibly loyal, legacy customer base and immense brand equity built over decades.`;
                p2_economics = `They operate a localized, high-touch service model. Customer acquisition costs are astronomical, meaning customer lifetime value (LTV) must extend past 7 years to yield a profit.`;
            }

            const scale = Math.floor(Math.random() * 8 + 2) * 500; // $1B to $5B
            const p1 = `${brandName} is a massive, $${scale} million enterprise operating within the global ${industry} sector. They are widely recognized for ${p1_strength} However, their management hierarchy is notoriously inflexible.`;
            const p2 = `${p2_economics}`;
            const p3 = `Recently, the organization was shocked by a macro disruption: ${complication} This dynamic has structurally broken their historical workflow, paralyzing capital flow and threatening their long-term viability.`;

            const goalTarget = ["profit margins", "market share", "operating expenditure", "asset utilization", "customer retention"][Math.floor(Math.random()*5)];
            const goalPct = Math.floor(Math.random() * 15 + 10);
            const goalTime = ["18 months", "the next fiscal year", "3 quarters", "120 days"][Math.floor(Math.random()*4)];
            const clientGoal = `Stabilize and improve ${goalTarget} by ${goalPct}% strictly within ${goalTime}.`;

            // 3. MATH ARCHEPTYPES (Resolves Requirement 2: McKinsey Rigor Match)
            let mathObj = {};
            let chartConfig = {};
            let q3_data = {};

            if (caseTheme === "ElectroLight") {
                // ElectroLight Archetype: Break-even Market Share
                const marketSize = Math.floor(Math.random() * 5 + 10) * 10; // 100 to 150 Million
                const fixedCost = Math.floor(Math.random() * 4 + 2) * 20; // 40, 60, 80, 100M
                const price = (Math.random() * 3 + 2).toFixed(2); // $2.00 to $5.00
                const varCost = (price - (Math.random() * 0.5 + 0.5)).toFixed(2); // Margin 0.5 to 1.0
                const margin = (price - varCost).toFixed(2);
                const beUnits = (fixedCost * 1000000) / margin;
                const msReq = (beUnits / (marketSize * 1000000)) * 100;

                mathObj = {
                    prompt: `<p>To execute the ${caseType}, the client must launch a new operational footprint. The total addressable market in this region is exactly ${marketSize} Million units annually.</p><p>The launch requires a fixed upfront marketing and CapEx investment of $${fixedCost} Million. The product will price at $${price} per unit, with variable operational costs of $${varCost} per unit. What exact market share percentage must ${brandName} capture in Year 1 just to break even on their fixed investment?</p>`,
                    steps: [
                        `Calculate Unit Contribution Margin: $${price} Price &minus; $${varCost} VarCost = $${margin} Margin/Unit.`,
                        `Calculate Break-Even Units: $${fixedCost}M Fixed Cost / $${margin} Margin = ${(beUnits/1000000).toFixed(2)}M Units.`,
                        `Calculate Market Share: (${(beUnits/1000000).toFixed(2)}M Units / ${marketSize}M Total Market) * 100.`
                    ],
                    answer: `${msReq.toFixed(1)}% Market Share Required.`
                };

                // ElectroLight Chart: Market Share Bar / Bubble map
                chartConfig = {
                    type: 'bar',
                    config: {
                        title: 'Current Competitor Market Share (%)',
                        data: {
                            labels: ['Incumbent A', 'Incumbent B', 'Local Fragmented', 'White Space (Available)'],
                            datasets: [{ label: 'Market Share %', data: [45, 25, 20, 10], backgroundColor: ['#051c2c', '#005f9e', '#94a3b8', '#e06b20'] }]
                        }
                    }
                };
                q3_data = {
                    prompt: `Review the market share distribution exhibit above. Based on your previous break-even calculation of ${msReq.toFixed(1)}%, what is your immediate strategic concern?`,
                    redHerring: "Incumbent A's massive 45% share looks like the primary target to steal volume from.",
                    correlation: "The 'White Space' (unclaimed market) is only 10%. Because the client requires a share higher than 10% to break even, they CANNOT simply capture new growth—they must actively steal share from entrenched competitors.",
                    takeaway: "The entry strategy must shift from a 'market expansion' marketing play to an aggressive 'price war / displacement' strategy targeting Incumbent B's customers."
                };
            } 
            else if (caseTheme === "Talbot") {
                // Talbot Trucks Archetype: TCO Parity
                const baseAsset = Math.floor(Math.random() * 5 + 5) * 10; // 50 to 100k
                const baseOp = Math.floor(Math.random() * 2 + 2) * 10; // 20k to 40k
                const newOp = baseOp - 15; // Cheaper to run
                const years = 5;
                const maxPrice = baseAsset + ((baseOp - newOp) * years);

                mathObj = {
                    prompt: `<p>The client is evaluating swapping their legacy assets for next-generation automated systems. Currently, a legacy asset costs $${baseAsset},000 to acquire and requires $${baseOp},000 per year to operate.</p><p>The next-generation asset reduces operating costs to $${newOp},000 per year. Assuming a ${years}-year operational lifespan for both, what is the MAXIMUM purchase price the client can pay for the new asset so that the Total Cost of Ownership (TCO) exactly equals the legacy asset?</p>`,
                    steps: [
                        `Calculate Legacy TCO: $${baseAsset}k Asset + ($${baseOp}k OpCost * ${years} yrs) = $${baseAsset + (baseOp * years)}k.`,
                        `Set Parity Equation: New Asset Price + ($${newOp}k OpCost * ${years} yrs) = Legacy TCO.`,
                        `Solve for New Asset Price: $${baseAsset + (baseOp * years)}k &minus; $${newOp * years}k.`
                    ],
                    answer: `Maximum Purchase Price: $${maxPrice},000.`
                };

                // Talbot Chart: 100% Stacked Bar TCO comparison
                chartConfig = {
                    type: 'stackedBar100',
                    config: {
                        title: 'Total Cost of Ownership Breakdown (5-Year Lifecycle)',
                        data: {
                            labels: ['Legacy Asset', 'Next-Gen Asset'],
                            datasets: [
                                { label: 'Upfront CapEx', data: [30, 60] },
                                { label: 'Energy / Fuel', data: [40, 15] },
                                { label: 'Maintenance / Labor', data: [30, 25] }
                            ]
                        }
                    }
                };
                q3_data = {
                    prompt: `Analyze the TCO distribution exhibit above. What operational reality does this chart reveal about the transition strategy?`,
                    redHerring: "The massive reduction in Energy/Fuel costs makes the Next-Gen asset look like an undeniable operational victory.",
                    correlation: "While operational costs drop, the risk profile shifts entirely from variable OPEX to fixed CAPEX. The client is locking up their balance sheet on Day 1.",
                    takeaway: "If the client's utilization rate drops due to macro conditions, they cannot scale down costs (like fuel). The transition must be paired with financial hedging or leasing models to spread the CapEx hit."
                };
            }
            else if (caseTheme === "GlobaPharm") {
                // GlobaPharm Archetype: Pipeline / Waterfall Expected Value
                const trial1 = 60; // 60% pass
                const trial2 = 40; // 40% pass
                const successValue = Math.floor(Math.random() * 5 + 10) * 100; // 1000M to 1500M
                const invRequired = Math.floor(Math.random() * 3 + 2) * 50; // 100 to 200M
                const currentEV = successValue * (trial1/100) * (trial2/100);
                const reqEV = currentEV + invRequired;
                const reqPass2 = (reqEV / (successValue * (trial1/100))) * 100;

                mathObj = {
                    prompt: `<p>The client has an active integration pipeline. Currently, Phase 1 projects have a ${trial1}% chance of success. If they pass, Phase 2 projects have a ${trial2}% chance of final deployment. A fully deployed project yields a present value of $${successValue} Million.</p><p>The team proposes a $${invRequired} Million internal investment to upgrade Phase 2 capabilities. To break even on this investment, to what exact percentage must the Phase 2 success rate increase?</p>`,
                    steps: [
                        `Calculate Current Expected Value (EV): $${successValue}M * ${trial1}% * ${trial2}% = $${currentEV}M.`,
                        `Determine Required EV to Break Even: $${currentEV}M Current + $${invRequired}M Investment = $${reqEV}M Target EV.`,
                        `Solve for New Phase 2 Rate: $${reqEV}M Target EV / ($${successValue}M * ${trial1}%) = Target Rate.`
                    ],
                    answer: `Phase 2 Success Rate must increase to ${reqPass2.toFixed(1)}%.`
                };

                chartConfig = {
                    type: 'waterfall',
                    config: {
                        title: 'Pipeline Attrition Value ($M)',
                        data: {
                            labels: ['Total Addressable Market', 'Phase 1 Failure Loss', 'Phase 2 Failure Loss', 'Commercialization Discount', 'Net Expected Value'],
                            datasets: [{ label: 'Value ($M)', data: [[0, successValue], [successValue*0.6, successValue], [successValue*0.36, successValue*0.6], [successValue*0.3, successValue*0.36], [0, successValue*0.3]] }]
                        }
                    }
                };
                q3_data = {
                    prompt: `Review the Pipeline Attrition waterfall chart. Where is the true leverage point in this system?`,
                    redHerring: "Phase 1 failures wipe out the largest absolute dollar amount, suggesting we should focus R&D there.",
                    correlation: "By the time a project reaches Commercialization, the sunk costs are at their highest, making late-stage discounts devastating to ROI.",
                    takeaway: "The client must shift their assessment criteria. Failing early (Phase 1) is cheap; failing late or discounting at commercialization destroys enterprise value. The $ investment is correctly placed in late-stage improvements."
                };
            }
            else {
                // Diconsa Archetype: Segmented Population Savings
                const pop = Math.floor(Math.random() * 5 + 10) * 10; // 100 to 150M
                const targetPct = 20;
                const userPct = 50;
                const famSize = 4;
                const users = (pop * (targetPct/100) * (userPct/100)) / famSize; // Families
                const groupA = 60; // 60%
                const saveA = 15; // $15
                const groupB = 40; // 40%
                const saveB = 10; // $10
                
                const totalSave = (users * (groupA/100) * saveA * 12) + (users * (groupB/100) * saveB * 12); // Annualized

                mathObj = {
                    prompt: `<p>The client serves a total regional population of ${pop} Million. Exactly ${targetPct}% of this population fits the core demographic, and ${userPct}% of those actually use the service. Assume an average family unit size of ${famSize} (benefits are calculated per family, not per individual).</p><p>Implementing the new network will save ${groupA}% of families $${saveA}/month in logistics costs, and the remaining ${groupB}% of families $${saveB}/month. What is the total ANNUAL savings generated across the entire user base?</p>`,
                    steps: [
                        `Calculate Family Units: (${pop}M * ${targetPct}% * ${userPct}%) / ${famSize} people per family = ${users.toFixed(2)}M Families.`,
                        `Calculate Group A Annual Savings: (${users.toFixed(2)}M * ${groupA}%) * $${saveA} * 12 months.`,
                        `Calculate Group B Annual Savings: (${users.toFixed(2)}M * ${groupB}%) * $${saveB} * 12 months.`,
                        `Sum the segments.`
                    ],
                    answer: `Total Annual Savings: $${totalSave.toFixed(1)} Million.`
                };

                // Diconsa Chart: Data Table with Survey + Bubble Scatter
                chartConfig = {
                    type: 'bubble',
                    config: {
                        title: 'Customer Segmentation: Cost to Serve vs Satisfaction',
                        xTitle: 'Cost to Serve ($)',
                        yTitle: 'Satisfaction Score (1-100)',
                        data: {
                            datasets: [
                                { label: 'Group A (High Savings)', data: [{ x: 45, y: 30, r: 25 }], backgroundColor: '#e06b20' },
                                { label: 'Group B (Low Savings)', data: [{ x: 15, y: 85, r: 15 }], backgroundColor: '#005f9e' }
                            ]
                        }
                    }
                };
                q3_data = {
                    dataTable: {
                        headers: ["Segment", "Avg Distance to Node", "Willingness to Switch", "Current Churn %"],
                        rows: [
                            ["Group A", "45 Miles", "88% (High)", "14%"],
                            ["Group B", "5 Miles", "12% (Low)", "2%"]
                        ]
                    },
                    prompt: `Review the Customer Segmentation exhibit and data table above. What does this reveal about our roll-out strategy?`,
                    redHerring: "Group B has a fantastic satisfaction score (85) and low churn (2%), making them look like the ideal loyal base to protect.",
                    correlation: "Group A costs 3x more to serve, drives almost all the churn, and desperately wants to switch. The math from Question 2 proves they also generate the most savings.",
                    takeaway: "The rollout must NOT be uniform. 100% of initial capital and deployment must target Group A's territory, ignoring Group B entirely until Phase 2."
                };
            }

            // 4. "1000+ BRAINSTORM QUESTIONS" MATRIX (Resolves Requirement 4)
            const brainstormTopics = ["macro-economic downturn impacts", "brand perception risks", "talent acquisition bottlenecks", "data privacy vulnerabilities", "legacy technology integration delays", "supply chain resilience risks", "internal change management friction"];
            const selectedTopic = brainstormTopics[Math.floor(Math.random() * brainstormTopics.length)];
            
            const q4_prompt = `The ${sponsor} reviews your findings, but introduces a new, unmodeled risk: "If we execute this ${caseType}, we expose ourselves heavily to <strong>${selectedTopic}</strong>. I will not sign off until we have a mitigation strategy for this specific threat." What are 3 actionable strategies the client can deploy right now?`;

            return {
                brandName: brandName,
                industry: industry,
                caseType: caseType,
                clientGoal: clientGoal,
                p1: p1,
                p2: p2,
                p3: p3,
                mckinseyStudy: `The ${sponsor} has explicitly engaged McKinsey to diagnose the financial root causes of this disruption and execute an immediate stabilization framework.`,
                q1: {
                    prompt: `Given the explicit constraints triggered by the disruption, what specific operational trade-offs and financial structures must the team investigate?`,
                    pillars: [
                        { title: "Financial Leverage & Capital", bullets: ["Immediate CapEx requirements.", "Depreciation of stranded assets.", "Cost of capital and ROI hurdles."] },
                        { title: "Operational Execution Logistics", bullets: ["Supplier concentration risk profiles.", "Cost impacts of transit delays.", "Working capital buffers."] },
                        { title: "Market Positioning Dynamics", bullets: ["Customer acquisition cost (CAC) inflation.", "Price elasticity against disruptors.", "Contractual lock-in rates."] }
                    ]
                },
                q2: mathObj,
                q3: q3_data,
                q4: {
                    prompt: q4_prompt,
                    rubric: [
                        { theme: "Structural Hedges", bullets: ["Implement forward contracts to lock in baseline exposure.", "Transfer risk via external vendor performance bonds or strict SLAs."] },
                        { theme: "Phased Pilot Roadmaps", bullets: ["Limit initial exposure to a tightly controlled 5% regional pilot.", "Establish stage-gate veto thresholds before scaling."] },
                        { theme: "Proactive Stakeholder Control", bullets: ["Pre-negotiate subsidies or concessions with affected internal/external parties.", "Deploy a localized 'War Room' integration team."] }
                    ]
                },
                chart: chartConfig
            };
        }
    </script>
