<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McKinsey Style Case Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        mckinsey: { navy: '#051c2c', blue: '#005f9e', slate: '#334155', accent: '#e06b20' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; }
        .reveal-content { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .reveal-content.open { max-height: 3500px; padding-top: 1rem; padding-bottom: 1rem; }
        .markdown-table { width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
        .markdown-table th { background-color: #051c2c; color: white; padding: 0.75rem; text-align: left; border: 1px solid #e2e8f0; font-weight: 600; }
        .markdown-table td { padding: 0.75rem; border: 1px solid #e2e8f0; color: #334155; }
        .markdown-table tr:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body class="text-gray-900 antialiased flex flex-col min-h-screen bg-[#f4f6f8]">

    <nav class="bg-mckinsey-navy text-white py-4 px-6 shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-6 bg-mckinsey-blue"></div>
                <span class="text-sm font-bold uppercase tracking-widest text-gray-100">McKinsey Style Case Bot</span>
            </div>
        </div>
    </nav>

    <header class="max-w-5xl w-full mx-auto mt-8 px-4">
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <h1 class="text-lg font-bold text-mckinsey-navy mb-4 flex items-center">
                <span class="w-2 h-2 bg-mckinsey-blue rounded-full mr-2"></span>
                Case Strategy Parameters
            </h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Target Industry Vertical</label>
                    <select id="industry-select" class="w-full bg-white border border-gray-300 rounded p-2.5 text-sm font-medium text-gray-800 focus:ring-1 focus:ring-mckinsey-blue outline-none cursor-pointer">
                        <option value="Aerospace & Defense">Aerospace & Defense</option>
                        <option value="Consumer Packaged Goods (CPG)">Consumer Packaged Goods (CPG)</option>
                        <option value="Retail Banking">Retail Banking</option>
                        <option value="Healthcare Systems & Services">Healthcare Systems & Services</option>
                        <option value="Pharmaceuticals">Pharmaceuticals</option>
                        <option value="High Tech & Semiconductors">High Tech & Semiconductors</option>
                        <option value="Telecommunications">Telecommunications</option>
                        <option value="Oil & Gas">Oil & Gas</option>
                        <option value="E-commerce">E-commerce</option>
                        <option value="Travel & Logistics">Travel & Logistics</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Strategic Case Type</label>
                    <select id="type-select" class="w-full bg-white border border-gray-300 rounded p-2.5 text-sm font-medium text-gray-800 focus:ring-1 focus:ring-mckinsey-blue outline-none cursor-pointer">
                        <option value="Profitability Optimization">Profitability Optimization</option>
                        <option value="Market Entry Strategy">Market Entry Strategy</option>
                        <option value="Pricing Strategy">Pricing Strategy</option>
                        <option value="M&A Due Diligence">M&A Due Diligence</option>
                        <option value="Growth Strategy">Growth Strategy</option>
                        <option value="Supply Chain & Logistics">Supply Chain & Logistics</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="executeCaseEngine()" class="w-full bg-mckinsey-blue hover:bg-blue-800 text-white font-semibold text-xs py-3 px-4 rounded shadow-sm transition duration-150 uppercase tracking-widest">
                        Generate Custom Case
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main id="workspace" class="max-w-5xl w-full mx-auto mt-8 px-4 mb-24 hidden"></main>

    <script>
        let chartInstance = null;

        function toggleContent(id) {
            const el = document.getElementById(id);
            const ind = document.getElementById('ind-' + id);
            if (el.classList.contains('open')) {
                el.classList.remove('open');
                ind.innerHTML = '&#9662;';
            } else {
                el.classList.add('open');
                ind.innerHTML = '&#9652;';
            }
        }

        function executeCaseEngine() {
            const ind = document.getElementById('industry-select').value;
            const typ = document.getElementById('type-select').value;
            const ws = document.getElementById('workspace');
            
            if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
            ws.classList.remove('hidden');
            
            const data = buildDynamicPayload(ind, typ);
            
            let exhibitHtml = '';
            if (data.q3.table) {
                exhibitHtml = `<table class="markdown-table">
                    <thead><tr>${data.q3.table.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                    <tbody>${data.q3.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
                </table>`;
            }

            ws.innerHTML = `
                <!-- BRIEFING -->
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="bg-mckinsey-navy text-white p-6 border-b border-gray-800">
                        <span class="text-xs font-bold uppercase tracking-widest text-mckinsey-blue block mb-1">${data.industry} | ${data.caseType}</span>
                        <h2 class="text-3xl font-bold tracking-tight">${data.brand}</h2>
                    </div>
                    <div class="p-8 space-y-6">
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-mckinsey-navy mb-1">Client Goal</h3>
                            <p class="text-base font-semibold text-gray-900">${data.goal}</p>
                        </div>
                        <hr class="border-gray-100" />
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-mckinsey-navy mb-2">Situation Description</h3>
                            <div class="text-sm text-gray-700 leading-relaxed space-y-4">
                                <p>${data.p1}</p>
                                <p>${data.p2}</p>
                                <p>${data.p3}</p>
                            </div>
                        </div>
                        <hr class="border-gray-100" />
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-mckinsey-navy mb-2">McKinsey Study</h3>
                            <div class="bg-slate-50 border-l-4 border-mckinsey-navy p-4 text-sm font-medium text-mckinsey-navy italic">
                                ${data.study}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Q1 -->
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 1: Qualitative Framework</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-mckinsey-navy mb-6">${data.q1.prompt}</h3>
                        <button onclick="toggleContent('ans-1')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50">
                            <span>Reveal Ideal Answer Rubric</span><span id="ind-ans-1" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-1" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                                ${data.q1.pillars.map(p => `
                                    <div>
                                        <h4 class="font-bold text-mckinsey-blue mb-2 border-b border-blue-100 pb-1">${p.title}</h4>
                                        <ul class="list-disc pl-4 space-y-1 text-xs text-slate-700">${p.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Q2 -->
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 2: Quantitative Analysis</span>
                    </div>
                    <div class="p-8">
                        <div class="text-lg font-bold text-mckinsey-navy mb-4 space-y-3">${data.q2.prompt}</div>
                        <div class="mb-6 p-3 bg-blue-50 border border-blue-100 text-mckinsey-blue text-xs font-semibold rounded">
                            Helpful hint: Calculators are not allowed—you may want to write out your calculations on paper.
                        </div>
                        <button onclick="toggleContent('ans-2')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50">
                            <span>Reveal Calculation Steps</span><span id="ind-ans-2" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-2" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm p-6">
                                <ul class="list-decimal pl-5 space-y-2 text-slate-700">${data.q2.steps.map(s => `<li>${s}</li>`).join('')}</ul>
                                <div class="mt-4 p-4 bg-mckinsey-navy text-white font-bold rounded">Final Answer: ${data.q2.answer}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Q3 -->
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 3: Data Interpretation</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-mckinsey-navy mb-6">${data.q3.prompt}</h3>
                        <div class="w-full bg-white p-6 rounded border border-gray-200 shadow-inner mb-6">
                            ${exhibitHtml}
                            <div class="w-full h-[380px] relative"><canvas id="canvasRenderZone"></canvas></div>
                        </div>
                        <button onclick="toggleContent('ans-3')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50">
                            <span>Reveal Data Insights</span><span id="ind-ans-3" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-3" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm p-6 space-y-4">
                                <div><h4 class="font-bold text-red-600 mb-1">Red Herring Identified:</h4><p>${data.q3.redHerring}</p></div>
                                <div><h4 class="font-bold text-mckinsey-accent mb-1">Hidden Correlation:</h4><p>${data.q3.correlation}</p></div>
                                <div><h4 class="font-bold text-mckinsey-blue mb-1">Core Takeaway:</h4><p>${data.q3.takeaway}</p></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Q4 -->
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 4: Brainstorm</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-mckinsey-navy mb-6">${data.q4.prompt}</h3>
                        <button onclick="toggleContent('ans-4')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50">
                            <span>Reveal Brainstorming Strategy</span><span id="ind-ans-4" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-4" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm p-6 space-y-6">
                                ${data.q4.rubric.map(r => `
                                    <div>
                                        <h4 class="font-bold text-mckinsey-navy uppercase tracking-wider text-xs mb-2 border-b pb-1">${r.theme}</h4>
                                        <ul class="list-disc pl-5 space-y-1 text-slate-700">${r.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            renderChart(data.chart.type, data.chart.config);
            ws.scrollIntoView({ behavior: 'smooth' });
        }

        function renderChart(type, config) {
            const ctx = document.getElementById('canvasRenderZone').getContext('2d');
            let chartConfig = {
                type: type,
                data: config.data,
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { title: { display: true, text: config.title, font: {size: 16} } }
                }
            };
            
            if (type === 'bubble' || type === 'scatter') {
                chartConfig.options.scales = { x: { title: { display: true, text: config.xTitle } }, y: { title: { display: true, text: config.yTitle } } };
            } else if (type === 'stackedBar100') {
                chartConfig.type = 'bar';
                chartConfig.options.scales = { x: { stacked: true }, y: { stacked: true, max: 100 } };
            } else if (type === 'waterfall' || type === 'dualAxis') {
                chartConfig.type = 'bar';
                if (type === 'dualAxis') {
                    chartConfig.options.scales = { y: { position: 'left' }, y1: { position: 'right', grid: { drawOnChartArea: false } } };
                }
            }

            chartInstance = new Chart(ctx, chartConfig);
        }

        // --- COMBINATORIC GENERATION ENGINE ---
        function buildDynamicPayload(industry, caseType) {
            
            // 1. DYNAMIC BRANDING
            const brands = ['AethelCorp', 'VeloStrat', 'NexaPharma', 'Terralumen', 'Apex Global', 'Vanguard Systems', 'Zephyr Logistics', 'Calyx Dynamics'];
            const brand = brands[Math.floor(Math.random() * brands.length)];
            const sponsor = ['VP of Global Procurement', 'Chief Risk Officer', 'Head of Network Distribution', 'Chief Supply Chain Officer', 'CFO', 'Head of Strategy'][Math.floor(Math.random() * 6)];

            // 2. COMBINATORIC SITUATION MATRIX (Yields 10,000+ unique opening paragraphs)
            const sizes = [500, 850, 1200, 3000, 5400];
            const p1_scales = [`a rapidly scaling insurgent valued at $${sizes[Math.floor(Math.random()*5)]}M`, `a massive, entrenched legacy player generating $${sizes[Math.floor(Math.random()*5)]}M annually`, `a highly specialized regional operator with a $${sizes[Math.floor(Math.random()*5)]}M capitalization`];
            const p1_strengths = [`possessing an incredibly dense, multi-tier logistics footprint`, `commanding absolute pricing power due to a highly defensible IP portfolio`, `leveraging deep, exclusive governmental contracts`];
            const p1_weaknesses = [`However, they are severely burdened by bloated middle-management layers.`, `Yet, their legacy technology stack creates massive data silos.`, `Unfortunately, they suffer from extremely high customer churn rates.`];
            
            const p2_economics = [
                `Unit economics in this sector dictate heavy upfront CapEx, meaning the client must maintain a strict 90%+ utilization rate across their network to service debt.`,
                `Their model relies on high-volume, thin-margin B2B distribution, operating purely on a just-in-time inventory system to minimize working capital.`,
                `They operate a high-margin, low-volume direct-to-consumer model that is highly dependent on keeping Customer Acquisition Costs (CAC) below strict lifetime value (LTV) thresholds.`
            ];

            const p3_triggers = [
                `a sudden, localized protectionist tariff that has locked their primary supply route`,
                `an aggressive, highly-funded digital disruptor initiating a brutal domestic price war`,
                `a sudden fragmentation of their tier-1 supplier network due to geopolitical instability`,
                `a stringent new regulatory compliance mandate that essentially outlaws their primary distribution mechanism`
            ];

            const p1 = `${brand} is ${p1_scales[Math.floor(Math.random()*3)]} within the ${industry} market, widely recognized for ${p1_strengths[Math.floor(Math.random()*3)]}. ${p1_weaknesses[Math.floor(Math.random()*3)]}`;
            const p2 = p2_economics[Math.floor(Math.random()*3)];
            const p3 = `Recently, the organization was derailed by a macro disruption: ${p3_triggers[Math.floor(Math.random()*4)]}. This has completely broken their historical workflow, draining capital and jeopardizing their market stance.`;

            // 3. TARGET GOALS
            const timelines = ['18 months', '9 months', '3 quarters', '120 days', 'the upcoming fiscal year'];
            const targets = ['reverse a 15% margin degradation', 'recapture 10% lost market share', 'reduce operational CapEx by 20%', 'achieve cost-parity with offshore rivals'];
            const goal = `To ${targets[Math.floor(Math.random()*4)]} strictly within ${timelines[Math.floor(Math.random()*5)]}.`;

            // 4. MCKINSEY ARCHETYPE ROUTING (Math & Charts tailored to 6 URLs)
            let q2 = {}, q3 = {}, chart = {};
            const archetypes = ["Beautify", "Diconsa", "ElectroLight", "GlobaPharm", "NationalEd", "Talbot"];
            let selectedArchetype = archetypes[Math.floor(Math.random() * archetypes.length)];

            // Match case types logically to archetypes if possible
            if (caseType.includes("Pricing") || caseType.includes("Market Entry")) selectedArchetype = "ElectroLight";
            if (caseType.includes("M&A") || caseType.includes("Growth")) selectedArchetype = "GlobaPharm";
            if (caseType.includes("Supply Chain") || caseType.includes("Optimization")) selectedArchetype = "Talbot";

            if (selectedArchetype === "ElectroLight") {
                const mktsize = Math.floor(Math.random() * 5 + 10) * 10; // 100-150M
                const fcost = Math.floor(Math.random() * 4 + 2) * 10; // 20-50M
                const price = (Math.random() * 3 + 2).toFixed(2);
                const margin = (price * 0.4).toFixed(2);
                const beUnits = (fcost * 1000000) / margin;
                const ms = (beUnits / (mktsize * 1000000)) * 100;
                
                q2 = {
                    prompt: `<p>To launch their counter-strategy, ${brand} requires an upfront investment of $${fcost} Million. The total regional market demand is exactly ${mktsize} Million units. If the product prices at $${price} with a strict $${margin} unit margin, what exact percentage of the total market must the client capture just to break even?</p>`,
                    steps: [
                        `Calculate Break-Even Units: $${fcost}M Fixed Cost / $${margin} Margin = ${(beUnits/1000000).toFixed(2)}M Units.`,
                        `Calculate Market Share: (${(beUnits/1000000).toFixed(2)}M Units / ${mktsize}M Total Market) * 100.`
                    ],
                    answer: `${ms.toFixed(1)}% Market Share Required.`
                };
                chart = { type: 'bar', config: { title: 'Current Competitor Market Share (%)', data: { labels: ['Incumbent A', 'Incumbent B', 'Fragmented', 'White Space'], datasets: [{ label: 'Share %', data: [55, 20, 15, 10], backgroundColor: ['#051c2c', '#005f9e', '#94a3b8', '#e06b20'] }] } } };
                q3 = {
                    prompt: `Review the competitor market share exhibit. Based on the calculated break-even requirement of ${ms.toFixed(1)}%, what is the immediate strategic hurdle?`,
                    redHerring: "Incumbent A's 55% share looks impenetrable and suggests we should focus on the Fragmented players.",
                    correlation: `The 'White Space' (available market) is only 10%. Since the client requires ${ms.toFixed(1)}% to break even, growth alone is mathematically insufficient.`,
                    takeaway: "The strategy must explicitly be a 'displacement' strategy. They must actively steal share from entrenched incumbents, requiring a massive pricing discount or superior product feature."
                };
            } 
            else if (selectedArchetype === "Talbot") {
                const capEx = Math.floor(Math.random() * 4 + 4) * 10; // 40k-70k
                const oldOp = Math.floor(Math.random() * 3 + 2) * 10; // 20-40k
                const newOp = oldOp - 15; 
                const yrs = 5;
                const maxPrice = capEx + ((oldOp - newOp) * yrs);

                q2 = {
                    prompt: `<p>${brand} is considering replacing legacy assets. A legacy unit costs $${capEx},000 upfront and $${oldOp},000/year to run. A next-gen unit drops run costs to $${newOp},000/year. Assuming a ${yrs}-year lifecycle for both, what is the MAXIMUM purchase price they can pay for a next-gen unit to ensure Total Cost of Ownership (TCO) remains equal to legacy?</p>`,
                    steps: [
                        `Legacy TCO: $${capEx}k CapEx + ($${oldOp}k &times; ${yrs} yrs) = $${capEx + (oldOp * yrs)}k.`,
                        `Set Parity: Next-Gen CapEx + ($${newOp}k &times; ${yrs} yrs) = $${capEx + (oldOp * yrs)}k.`,
                        `Solve for Next-Gen CapEx: $${capEx + (oldOp * yrs)}k &minus; $${newOp * yrs}k.`
                    ],
                    answer: `Maximum Purchase Price: $${maxPrice},000.`
                };
                chart = { type: 'stackedBar100', config: { title: 'Total Cost of Ownership Breakdown (5-Year Lifecycle)', data: { labels: ['Legacy Asset', 'Next-Gen Asset'], datasets: [{ label: 'Upfront CapEx', data: [30, 65], backgroundColor: '#051c2c' }, { label: 'Energy / Fuel', data: [45, 15], backgroundColor: '#005f9e' }, { label: 'Labor', data: [25, 20], backgroundColor: '#94a3b8' }] } } };
                q3 = {
                    prompt: `Analyze the TCO distribution exhibit. What severe operational vulnerability does the next-gen asset introduce?`,
                    redHerring: "The massive drop in Energy/Fuel costs makes the next-gen asset appear operationally superior in every way.",
                    correlation: "While total costs equalize, the risk profile shifts entirely from variable OpEx to fixed CapEx. The balance sheet takes the hit on Day 1.",
                    takeaway: "If utilization rates drop during a market downturn, the client cannot scale down costs (like fuel). The transition must be paired with financial leasing to hedge the CapEx risk."
                };
            }
            else if (selectedArchetype === "GlobaPharm") {
                const t1 = 50, t2 = 40; 
                const val = Math.floor(Math.random() * 5 + 10) * 100; // 1000M-1500M
                const inv = 100;
                const currentEV = val * (t1/100) * (t2/100);
                const reqPass = ((currentEV + inv) / (val * (t1/100))) * 100;

                q2 = {
                    prompt: `<p>In the R&D pipeline, Phase 1 has a ${t1}% success rate. Phase 2 has a ${t2}% success rate. A fully deployed project yields $${val} Million. The team wants to invest $${inv} Million to improve Phase 2. To exactly break even on this investment, what must the new Phase 2 success rate become?</p>`,
                    steps: [
                        `Current Expected Value (EV): $${val}M * ${t1}% * ${t2}% = $${currentEV}M.`,
                        `Target EV to Break Even: $${currentEV}M + $${inv}M Investment = $${currentEV + inv}M.`,
                        `Solve for new Phase 2 Rate: $${currentEV + inv}M / ($${val}M * ${t1}%) * 100.`
                    ],
                    answer: `Phase 2 Success Rate must increase to ${reqPass.toFixed(1)}%.`
                };
                chart = { type: 'waterfall', config: { title: 'Pipeline Expected Value Attrition ($M)', data: { labels: ['Total Addressable Market', 'Phase 1 Failure Loss', 'Phase 2 Failure Loss', 'Net Expected Value'], datasets: [{ label: 'Value', data: [[0, val], [val*0.5, val], [val*0.2, val*0.5], [0, val*0.2]], backgroundColor: ['#051c2c', '#e06b20', '#e06b20', '#005f9e'] }] } } };
                q3 = {
                    prompt: `Review the Expected Value waterfall chart. Where is the true leverage point in this pipeline system?`,
                    redHerring: "Phase 1 failures wipe out the largest absolute dollar amount, suggesting we should focus all R&D investment there.",
                    correlation: "By the time a project reaches Phase 2, the sunk costs and time investments are at their highest, making late-stage attrition devastating to ROI.",
                    takeaway: "The client must shift assessment criteria. Failing early (Phase 1) is cheap; failing late destroys enterprise value. Investment is correctly placed in late-stage Phase 2 improvements."
                };
            }
            else {
                // Beautify Archetype: ROI & Data Tables
                const rev = Math.floor(Math.random() * 4 + 4) * 10; // 40-70M
                const margin = 20; 
                const cannibalization = 15; // 15M
                const netProfit = (rev * (margin/100)) - cannibalization;

                q2 = {
                    prompt: `<p>${brand} wants to launch a new digital channel. It will generate $${rev} Million in gross revenue with a ${margin}% net operating margin. However, internal tracking shows it will cannibalize exactly $${cannibalization} Million in profit from their legacy retail channel. What is the true absolute incremental profit generated by this launch?</p>`,
                    steps: [
                        `Calculate Gross Profit: $${rev}M * ${margin}% = $${rev * (margin/100)}M.`,
                        `Subtract Cannibalization Loss: $${rev * (margin/100)}M &minus; $${cannibalization}M.`
                    ],
                    answer: `Incremental Profit: $${netProfit < 0 ? '-' : ''}$${Math.abs(netProfit)} Million.`
                };
                chart = { type: 'bubble', config: { xTitle: 'Cannibalization Risk (Score)', yTitle: 'Revenue Potential ($M)', title: 'Channel Expansion Matrix', data: { datasets: [{ label: 'High Risk', data: [{x: 85, y: 70, r: 20}], backgroundColor: '#e06b20' }, { label: 'Low Risk', data: [{x: 20, y: 45, r: 15}], backgroundColor: '#005f9e' }] } } };
                q3 = {
                    table: {
                        headers: ["Channel Variant", "Gross Rev ($M)", "Op Margin %", "Cannibalization Impact ($M)"],
                        rows: [
                            ["Direct-to-Consumer", `$${rev}`, `${margin}%`, `-$${cannibalization}`],
                            ["Wholesale Partner", `$${rev - 10}`, `${margin - 5}%`, `-$2`]
                        ]
                    },
                    prompt: `Review the Channel Expansion data table and matrix. Based on your calculation of $${netProfit}M incremental profit for D2C, what strategic pivot is required?`,
                    redHerring: "The Direct-to-Consumer channel boasts the highest Gross Revenue and Operating Margin, making it look like the obvious primary focus.",
                    correlation: "When factoring in the massive $15M cannibalization impact, the D2C channel is actually destroying enterprise value (yielding a negative/flat net profit).",
                    takeaway: "The client must halt the D2C launch immediately. They should pivot capital to the Wholesale Partner channel, which yields lower gross margins but avoids cannibalizing the cash-cow legacy network."
                };
            }

            // 5. 4,000+ COMBINATORIC BRAINSTORM ENGINE (Q4)
            const actors = ["an activist shareholder group", "a global regulatory coalition", "a consolidated tier-1 supplier network", "a highly-funded tech insurgent", "a sudden shift in consumer ESG demands"];
            const actions = ["initiates a hostile proxy war", "bans a critical raw material used in your flagship product", "demands a 30% increase in procurement costs", "slashes market pricing by 40%", "boycotts your primary distribution channel"];
            const impacts = ["destroying the projected payback period", "paralyzing the launch timeline", "wiping out your core operating margin", "forcing a complete redesign of the supply chain", "causing massive customer churn"];
            
            const randomActor = actors[Math.floor(Math.random()*5)];
            const randomAction = actions[Math.floor(Math.random()*5)];
            const randomImpact = impacts[Math.floor(Math.random()*5)];

            return {
                brandName: brand,
                industry: industry,
                caseType: caseType,
                goal: clientGoal,
                p1: p1,
                p2: p2,
                p3: p3,
                mckinseyStudy: `The ${sponsor} has explicitly engaged McKinsey to diagnose the financial root causes of this disruption and execute an immediate stabilization framework.`,
                q1: {
                    prompt: `Given the exact parameters of the macro disruption, what specific operational trade-offs and financial metrics must the team investigate to evaluate a recovery?`,
                    pillars: [
                        { title: "Financial Leverage & Capital", bullets: ["Immediate CapEx requirements.", "Depreciation of stranded assets.", "Cost of capital and ROI hurdles."] },
                        { title: "Operational Execution Logistics", bullets: ["Supplier concentration risk profiles.", "Cost impacts of transit delays.", "Working capital buffers."] },
                        { title: "Market Positioning Dynamics", bullets: ["Customer acquisition cost (CAC) inflation.", "Price elasticity against disruptors.", "Contractual lock-in rates."] }
                    ]
                },
                q2: q2,
                q3: q3,
                q4: {
                    prompt: `The ${sponsor} reviews your model, but introduces a massive new, unmodeled risk: "What if <strong>${randomActor} ${randomAction}, ${randomImpact}</strong>? I will not sign off until we have a mitigation strategy." What are 3 actionable strategies to mitigate this exact threat?`,
                    rubric: [
                        { theme: "Structural Hedges", bullets: ["Implement forward contracts to lock in baseline exposure.", "Transfer risk via external vendor performance bonds or strict SLAs."] },
                        { theme: "Phased Pilot Roadmaps", bullets: ["Limit initial exposure to a tightly controlled 5% regional pilot.", "Establish stage-gate veto thresholds before scaling capital."] },
                        { theme: "Proactive Stakeholder Control", bullets: ["Pre-negotiate subsidies or concessions with affected internal/external parties.", "Deploy a localized 'War Room' integration team."] }
                    ]
                },
                chart: chart
            };
        }
    </script>
