<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McKinsey Style Case Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        mckinsey: {
                            navy: '#051c2c',
                            blue: '#005f9e',
                            lightBg: '#f4f6f8',
                            slate: '#334155',
                            accent: '#e06b20'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; }
        .reveal-content { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .reveal-content.open { max-height: 2500px; }
        .markdown-table { width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
        .markdown-table th { background-color: #051c2c; color: white; padding: 0.75rem; text-align: left; border: 1px solid #e2e8f0; font-weight: 600; }
        .markdown-table td { padding: 0.75rem; border: 1px solid #e2e8f0; color: #334155; }
        .markdown-table tr:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body class="text-gray-900 antialiased flex flex-col min-h-screen bg-[#f4f6f8]">

    <nav class="bg-[#051c2c] text-white py-4 px-6 border-b border-gray-800 shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-6 bg-[#005f9e]"></div>
                <span class="text-sm font-bold uppercase tracking-widest text-gray-100">McKinsey Style Case Bot</span>
            </div>
            <span class="text-xs font-mono text-[#005f9e] bg-slate-900/80 px-3 py-1 rounded border border-slate-800 font-semibold">AI Deployment Environment</span>
        </div>
    </nav>

    <header class="max-w-5xl w-full mx-auto mt-8 px-4">
        <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
            <h1 class="text-lg font-bold text-[#051c2c] mb-4 flex items-center">
                <span class="w-2 h-2 bg-[#005f9e] rounded-full mr-2"></span>
                Case Strategy Parameters
            </h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Target Industry Vertical</label>
                    <select id="industry-select" class="w-full bg-white border border-gray-300 rounded p-2.5 text-sm font-medium text-gray-800 focus:ring-1 focus:ring-[#005f9e] outline-none cursor-pointer">
                        <option value="Aerospace & Defense">Aerospace & Defense</option>
                        <option value="Automotive & Assembly">Automotive & Assembly</option>
                        <option value="Advanced Electronics">Advanced Electronics</option>
                        <option value="Agriculture">Agriculture</option>
                        <option value="Chemicals">Chemicals</option>
                        <option value="Consumer Packaged Goods (CPG)">Consumer Packaged Goods (CPG)</option>
                        <option value="Capital Projects & Infrastructure">Capital Projects & Infrastructure</option>
                        <option value="Electric Power & Natural Gas">Electric Power & Natural Gas</option>
                        <option value="Retail Banking">Retail Banking</option>
                        <option value="Asset Management">Asset Management</option>
                        <option value="Wealth Management">Wealth Management</option>
                        <option value="Healthcare Systems & Services">Healthcare Systems & Services</option>
                        <option value="Medical Devices">Medical Devices</option>
                        <option value="Pharmaceuticals">Pharmaceuticals</option>
                        <option value="Biotechnology">Biotechnology</option>
                        <option value="High Tech & Semiconductors">High Tech & Semiconductors</option>
                        <option value="Media & Entertainment">Media & Entertainment</option>
                        <option value="Telecommunications">Telecommunications</option>
                        <option value="Metals & Mining">Metals & Mining</option>
                        <option value="Oil & Gas">Oil & Gas</option>
                        <option value="Pulp & Paper">Pulp & Paper</option>
                        <option value="National Security">National Security</option>
                        <option value="Public Sector Education">Public Sector Education</option>
                        <option value="Economic Development">Economic Development</option>
                        <option value="Global Health NGOs">Global Health NGOs</option>
                        <option value="Real Estate">Real Estate</option>
                        <option value="E-commerce">E-commerce</option>
                        <option value="Brick & Mortar Retail">Brick & Mortar Retail</option>
                        <option value="Apparel & Luxury Goods">Apparel & Luxury Goods</option>
                        <option value="Travel & Logistics">Travel & Logistics</option>
                        <option value="Hospitality">Hospitality</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Strategic Case Type</label>
                    <select id="type-select" class="w-full bg-white border border-gray-300 rounded p-2.5 text-sm font-medium text-gray-800 focus:ring-1 focus:ring-[#005f9e] outline-none cursor-pointer">
                        <option value="Market Entry Strategy">Market Entry Strategy</option>
                        <option value="New Product/Service Launch">New Product/Service Launch</option>
                        <option value="Profitability Optimization (Revenue Side)">Profitability Optimization (Revenue Side)</option>
                        <option value="Profitability Optimization (Cost Side)">Profitability Optimization (Cost Side)</option>
                        <option value="M&A Due Diligence (Buy-Side)">M&A Due Diligence (Buy-Side)</option>
                        <option value="Post-Merger Operational Integration">Post-Merger Operational Integration</option>
                        <option value="Growth Strategy">Growth Strategy</option>
                        <option value="Digital Transformation & Automation">Digital Transformation & Automation</option>
                        <option value="Capital Investment/Asset Renewal Optimization">Capital Investment/Asset Renewal Optimization</option>
                        <option value="Supply Chain & Logistics Resilience">Supply Chain & Logistics Resilience</option>
                        <option value="Competitive Threat Response">Competitive Threat Response</option>
                        <option value="Regulatory/Tariff Compliance Strategy">Regulatory/Tariff Compliance Strategy</option>
                        <option value="Pricing & Monetization Optimization">Pricing & Monetization Optimization</option>
                        <option value="Sustainability/Decarbonization Transition">Sustainability/Decarbonization Transition</option>
                        <option value="Turnaround/Restructuring of Distressed Business">Turnaround/Restructuring of Distressed Business</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="executeCaseGenerationEngine()" class="w-full bg-[#005f9e] hover:bg-blue-800 text-white font-semibold text-xs py-3 px-4 rounded shadow-sm transition duration-150 uppercase tracking-widest">
                        Generate Custom Case Model
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main id="workspace" class="max-w-5xl w-full mx-auto mt-8 px-4 mb-24 hidden">
        </main>

    <script>
        function toggleAnswerContainer(id) {
            const content = document.getElementById(id);
            const indicator = document.getElementById('ind-' + id);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                indicator.innerHTML = '&#9662;';
            } else {
                content.classList.add('open');
                indicator.innerHTML = '&#9652;';
            }
        }

        function executeCaseGenerationEngine() {
            const industry = document.getElementById('industry-select').value;
            const caseType = document.getElementById('type-select').value;
            const workspace = document.getElementById('workspace');
            
            workspace.classList.remove('hidden');
            const payload = generateCaseJSON(industry, caseType);
            
            let tableRows = payload.questions[2].dataExhibit.rows.map(row => 
                `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
            ).join('');

            workspace.innerHTML = `
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="bg-[#051c2c] text-white p-6 border-b border-gray-800">
                        <span class="text-xs font-bold uppercase tracking-widest text-[#005f9e] block mb-1">${payload.caseMetadata.industry} | ${payload.caseMetadata.caseType}</span>
                        <h2 class="text-3xl font-bold tracking-tight">${payload.caseMetadata.brandName}</h2>
                    </div>
                    <div class="p-8 space-y-6">
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-[#051c2c] mb-1">Client Goal</h3>
                            <p class="text-base font-semibold text-gray-900">${payload.openingAct.clientGoal}</p>
                        </div>
                        <hr class="border-gray-100" />
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-[#051c2c] mb-2">Situation Description</h3>
                            <div class="text-sm text-gray-700 leading-relaxed space-y-4">
                                <p>${payload.openingAct.situationDescription.paragraph1}</p>
                                <p>${payload.openingAct.situationDescription.paragraph2}</p>
                                <p>${payload.openingAct.situationDescription.paragraph3}</p>
                            </div>
                        </div>
                        <hr class="border-gray-100" />
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-[#051c2c] mb-2">McKinsey Study</h3>
                            <div class="bg-slate-50 border-l-4 border-[#051c2c] p-4 text-sm font-medium text-[#051c2c] italic rounded-r">
                                ${payload.openingAct.mckinseyStudy}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mb-8">
                    <h2 class="text-xl font-bold text-gray-800 uppercase tracking-widest">Practice Case Questions</h2>
                    <div class="w-16 h-1 bg-[#005f9e] mx-auto mt-3"></div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question ${payload.questions[0].questionNumber}: ${payload.questions[0].type}</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-[#051c2c] mb-6">${payload.questions[0].prompt}</h3>
                        <button onclick="toggleAnswerContainer('ans-1')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-[#005f9e] hover:bg-slate-50 transition bg-white shadow-sm">
                            <span>Reveal Ideal Answer Rubric</span>
                            <span id="ind-ans-1" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-1" class="reveal-content bg-white">
                            <div class="p-6 mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 space-y-4">
                                <p class="text-xs text-gray-500 uppercase tracking-widest border-b pb-2">Custom MECE Architecture:</p>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    ${Object.values(payload.questions[0].idealAnswerRubric).map(pillar => `
                                        <div>
                                            <h4 class="font-bold text-[#005f9e] mb-2 border-b border-blue-100 pb-1">${pillar.title}</h4>
                                            <ul class="list-disc pl-4 space-y-1 text-xs text-slate-700">
                                                ${pillar.subMetrics.map(metric => `<li>${metric}</li>`).join('')}
                                            </ul>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question ${payload.questions[1].questionNumber}: ${payload.questions[1].type}</span>
                    </div>
                    <div class="p-8">
                        <div class="text-lg font-bold text-[#051c2c] mb-4 space-y-3">${payload.questions[1].prompt}</div>
                        <button onclick="toggleAnswerContainer('ans-2')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-[#005f9e] hover:bg-slate-50 transition bg-white shadow-sm">
                            <span>Reveal Ideal Answer & Calculations</span>
                            <span id="ind-ans-2" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-2" class="reveal-content bg-white">
                            <div class="p-6 mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 space-y-4">
                                <p class="text-xs text-gray-500 uppercase tracking-widest border-b pb-2">Mathematical Formulation:</p>
                                <div class="font-mono bg-gray-100 p-3 rounded text-xs space-y-1 text-slate-800">
                                    ${payload.questions[1].mathematicalFormulas.map(form => `<p>${form}</p>`).join('')}
                                </div>
                                <p class="text-xs text-gray-500 uppercase tracking-widest border-b pb-2 mt-4">Execution Steps:</p>
                                <ul class="list-decimal pl-5 space-y-2 text-sm text-slate-700">
                                    ${payload.questions[1].calculationSteps.map(step => `<li>${step}</li>`).join('')}
                                </ul>
                                <div class="mt-4 p-4 bg-[#051c2c] text-white font-bold rounded">
                                    Final Answer: ${payload.questions[1].correctAnswerWithUnits}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question ${payload.questions[2].questionNumber}: ${payload.questions[2].type}</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-[#051c2c] mb-6">${payload.questions[2].prompt}</h3>
                        
                        <div class="overflow-x-auto">
                            <table class="markdown-table">
                                <thead>
                                    <tr>
                                        ${payload.questions[2].dataExhibit.headers.map(h => `<th>${h}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>

                        <button onclick="toggleAnswerContainer('ans-3')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-[#005f9e] hover:bg-slate-50 transition bg-white shadow-sm mt-4">
                            <span>Reveal Data Synthesis & Insights</span>
                            <span id="ind-ans-3" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-3" class="reveal-content bg-white">
                            <div class="p-6 mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 space-y-4">
                                <div>
                                    <h4 class="font-bold text-red-600 mb-1">Red Herring Identified:</h4>
                                    <p>${payload.questions[2].analyticalInsights.redHerringIdentified}</p>
                                </div>
                                <div>
                                    <h4 class="font-bold text-[#e06b20] mb-1">Hidden Correlation:</h4>
                                    <p>${payload.questions[2].analyticalInsights.hiddenCorrelation}</p>
                                </div>
                                <div>
                                    <h4 class="font-bold text-[#005f9e] mb-1">Core Strategic Takeaway:</h4>
                                    <p>${payload.questions[2].analyticalInsights.coreTakeaway}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question ${payload.questions[3].questionNumber}: ${payload.questions[3].type}</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-[#051c2c] mb-6">${payload.questions[3].prompt}</h3>
                        <button onclick="toggleAnswerContainer('ans-4')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-[#005f9e] hover:bg-slate-50 transition bg-white shadow-sm">
                            <span>Reveal Executive Mitigation Rubric</span>
                            <span id="ind-ans-4" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-4" class="reveal-content bg-white">
                            <div class="p-6 mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 space-y-6">
                                ${Object.keys(payload.questions[3].brainstormingRubric).map(theme => `
                                    <div>
                                        <h4 class="font-bold text-[#051c2c] uppercase tracking-wider text-xs mb-2 border-b pb-1">${theme}</h4>
                                        <ul class="list-disc pl-5 space-y-1 text-slate-700">
                                            ${payload.questions[3].brainstormingRubric[theme].map(item => `<li>${item}</li>`).join('')}
                                        </ul>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            workspace.scrollIntoView({ behavior: 'smooth' });
        }

        function generateCaseJSON(industry, caseType) {
            const prefixes = ['Aethel', 'Velo', 'Nexa', 'Terra', 'Omni', 'Quantum', 'Lumina', 'Aero', 'Zephyr', 'Synapse', 'Calyx', 'Valiant'];
            const suffixes = ['Corp', 'Strat', 'Pharma', 'Lumen', 'Systems', 'Dynamics', 'Logistics', 'Networks', 'Tech', 'Holdings', 'Industries'];
            const brandName = prefixes[Math.floor(Math.random() * prefixes.length)] + suffixes[Math.floor(Math.random() * suffixes.length)];

            const sponsors = ['VP of Global Procurement', 'Chief Risk Officer', 'Head of Network Distribution', 'Chief Supply Chain Officer', 'EVP of Corporate Strategy', 'Chief Financial Officer', 'Head of Digital Transformation'];
            const executiveSponsor = sponsors[Math.floor(Math.random() * sponsors.length)];

            const complications = [
                "localized protectionist regulatory changes restricting cross-border material flows",
                "a structural shift to open-source alternatives cannibalizing core proprietary margins",
                "a rapid digital channel migration creating extreme latency in their legacy ERP networks",
                "fragmented multi-tiered supply chains collapsing under new geopolitical tariffs"
            ];
            const macroComplication = complications[Math.floor(Math.random() * complications.length)];

            // Mathematical Targets (A, B, C, D)
            const mathTypes = ['Net Present Value', 'Capacity Bottlenecks', 'Total Cost of Ownership', 'Market Share Thresholds'];
            const targetMath = mathTypes[Math.floor(Math.random() * mathTypes.length)];

            let mathData = {};
            if (targetMath === 'Capacity Bottlenecks') {
                const totalDemand = Math.floor(Math.random() * 5 + 10) * 100; // 1000M - 1500M
                const currentCap = totalDemand - 400; 
                mathData = {
                    prompt: `<p>The client faces immediate constraints. Total macro demand for the upcoming fiscal year is projected at ${totalDemand} Million units. Their existing facility network currently has a theoretical maximum output of ${currentCap} Million units.</p><p>To close the gap, they are evaluating an upgrade to "Facility Charlie", which currently processes 200 Million units annually. By what exact percentage must Facility Charlie increase its throughput to independently cover the entire global capacity shortfall?</p><p class="mt-4 italic font-semibold text-gray-600">Helpful hint: Calculators are not allowed—you may want to write out your calculations on paper.</p>`,
                    formulas: ["Shortfall = Total Demand - Current Capacity", "Required % Increase = (Shortfall / Facility Charlie Current Capacity) * 100"],
                    steps: [
                        `Calculate total unit shortfall: ${totalDemand}M - ${currentCap}M = 400M units.`,
                        `Identify target asset baseline: Facility Charlie = 200M units.`,
                        `Calculate percentage increase required: (400M / 200M) * 100.`
                    ],
                    answer: "200% Output Increase Required"
                };
            } else if (targetMath === 'Total Cost of Ownership') {
                const legacyLabor = Math.floor(Math.random() * 4 + 4) * 50; // 200 to 400 Million
                const tariffImpact = 150;
                mathData = {
                    prompt: `<p>Evaluating a cross-border asset reallocation, the client spends $${legacyLabor} Million annually in legacy domestic labor. Moving operations offshore will reduce base labor costs by 40%.</p><p>However, this triggers localized logistics tariffs amounting to a flat $${tariffImpact} Million annually. Factoring in both variables, what is the net annual financial impact (positive or negative) of this transition?</p><p class="mt-4 italic font-semibold text-gray-600">Helpful hint: Calculators are not allowed—you may want to write out your calculations on paper.</p>`,
                    formulas: ["New Labor Cost = Legacy Labor * (1 - 0.40)", "Net Transition Cost = New Labor Cost + Flat Tariff", "Financial Impact = Legacy Labor - Net Transition Cost"],
                    steps: [
                        `Calculate 40% labor reduction: 0.40 * $${legacyLabor}M = $${legacyLabor * 0.4}M in savings.`,
                        `Compare labor savings against the new tariff penalty: $${legacyLabor * 0.4}M savings vs $${tariffImpact}M tariffs.`,
                        `Subtract the penalty from the savings to find the net yield.`
                    ],
                    answer: `Net Impact: ${ (legacyLabor * 0.4) > tariffImpact ? "Positive" : "Negative" } $${Math.abs((legacyLabor * 0.4) - tariffImpact)} Million`
                };
            } else {
                // Default fallback to Market Share
                const totalMarket = 2500; // $2.5B
                const targetedShare = 20; // 20%
                mathData = {
                    prompt: `<p>A localized competitor price war requires a defensive volume strategy. The total regional market capitalization is $${totalMarket} Million. To retain pricing power, the client must hold exactly ${targetedShare}% of the market value.</p><p>If the average customer lifetime value (LTV) across this segment is fixed at $500, exactly how many active customers must the client maintain to successfully hit their defensive threshold?</p><p class="mt-4 italic font-semibold text-gray-600">Helpful hint: Calculators are not allowed—you may want to write out your calculations on paper.</p>`,
                    formulas: ["Required Market Value = Total Market * Target Percentage", "Required Customers = Required Market Value / LTV"],
                    steps: [
                        `Calculate the defensive financial threshold: $${totalMarket}M * 0.20 = $${totalMarket * 0.2}M.`,
                        `Divide the required financial threshold by the individual LTV metric: $${totalMarket * 0.2}M / $500.`,
                        `Convert millions cleanly to absolute integers.`
                    ],
                    answer: `${(totalMarket * 0.2 * 1000000 / 500).toLocaleString()} Active Customers`
                };
            }

            return {
                caseMetadata: {
                    brandName: brandName,
                    industry: industry,
                    caseType: caseType,
                    executiveSponsor: executiveSponsor,
                    macroComplication: macroComplication,
                    mathTargetVariable: targetMath
                },
                openingAct: {
                    clientGoal: `Restructuring a 14% operational margin degradation within an aggressive 18-month timeline to appease activist shareholders.`,
                    situationDescription: {
                        paragraph1: `${brandName} is a massive, $45 billion enterprise deeply entrenched in the global ${industry} sector. Historically commanding top-quartile market share, their core asset footprint consists of highly specialized, capital-intensive infrastructure distributed across four continents.`,
                        paragraph2: `The company's unit economics rely on a highly orchestrated distribution logistics network. They utilize a just-in-time supply chain model that heavily leverages third-party procurement vendors to maintain thin, highly optimized working capital cycles.`,
                        paragraph3: `However, the ecosystem was recently shocked by ${macroComplication}. This dynamic has fundamentally broken their legacy workflow, stranding capital assets and dramatically compressing their historical pricing power against agile, digital-first competitors.`
                    },
                    mckinseyStudy: `The ${executiveSponsor} has engaged McKinsey to run an exhaustive operational diagnostic and build a rigorous financial blueprint to navigate this existential transition.`
                },
                questions: [
                    {
                        questionNumber: 1,
                        type: "Structuring",
                        prompt: `Given the severe limitations imposed by ${macroComplication}, what core operational and financial leverage points must our team isolate to determine if a recovery is structurally feasible?`,
                        idealAnswerRubric: {
                            pillar1: {
                                title: "Asset Repositioning & Write-Downs",
                                subMetrics: ["Capital expenditure requirements for retrofitting infrastructure.", "Depreciation schedules of currently stranded operational assets.", "Real estate/lease liabilities across disrupted regions.", "Liquidation value of legacy inventory bottlenecks."]
                            },
                            pillar2: {
                                title: "Supply Chain Resilience & Tariffs",
                                subMetrics: ["Supplier concentration risk profiles in tier-1 and tier-2 nodes.", "Cost impact of localized tariffs on raw material COGS.", "Lead-time variance under the new regulatory framework.", "Working capital requirements to buffer new transit delays."]
                            },
                            pillar3: {
                                title: "Market Share & Pricing Power",
                                subMetrics: ["Customer acquisition cost (CAC) inflation via digital channels.", "Price elasticity modeling against new agile competitors.", "Contractual lock-in rates for enterprise-tier clients.", "Cost-to-serve metrics segmented by geographic territory."]
                            }
                        }
                    },
                    {
                        questionNumber: 2,
                        type: "Quantitative",
                        prompt: mathData.prompt,
                        mathematicalFormulas: mathData.formulas,
                        calculationSteps: mathData.steps,
                        correctAnswerWithUnits: mathData.answer
                    },
                    {
                        questionNumber: 3,
                        type: "Data Synthesis",
                        prompt: "Our data science engineers have extracted telemetry from the client's core logistics network. Review the data table below. Identify the primary operational bottleneck, taking care to avoid any misleading metrics.",
                        dataExhibit: {
