<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McKinsey Style Case Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        mckinsey: { navy: '#051c2c', blue: '#005f9e', slate: '#334155', accent: '#e06b20' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; }
        .reveal-content { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .reveal-content.open { max-height: 2500px; padding-top: 1rem; padding-bottom: 1rem; }
    </style>
</head>
<body class="text-gray-900 antialiased flex flex-col min-h-screen bg-[#f4f6f8]">

    <nav class="bg-mckinsey-navy text-white py-4 px-6 border-b border-gray-800 shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-6 bg-mckinsey-blue"></div>
                <span class="text-sm font-bold uppercase tracking-widest text-gray-100">McKinsey Style Case Bot</span>
            </div>
            <span class="text-xs font-mono text-mckinsey-blue bg-slate-900/80 px-3 py-1 rounded border border-slate-800 font-semibold">AI Deployment Environment</span>
        </div>
    </nav>

    <header class="max-w-5xl w-full mx-auto mt-8 px-4">
        <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
            <h1 class="text-lg font-bold text-mckinsey-navy mb-4 flex items-center">
                <span class="w-2 h-2 bg-mckinsey-blue rounded-full mr-2"></span>
                Case Strategy Parameters
            </h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Target Industry Vertical</label>
                    <select id="industry-select" class="w-full bg-white border border-gray-300 rounded p-2.5 text-sm font-medium text-gray-800 focus:ring-1 focus:ring-mckinsey-blue outline-none cursor-pointer">
                        <option value="Aerospace & Defense">Aerospace & Defense</option>
                        <option value="Automotive & Assembly">Automotive & Assembly</option>
                        <option value="Advanced Electronics">Advanced Electronics</option>
                        <option value="Agriculture">Agriculture</option>
                        <option value="Chemicals">Chemicals</option>
                        <option value="Consumer Packaged Goods (CPG)">Consumer Packaged Goods (CPG)</option>
                        <option value="Capital Projects & Infrastructure">Capital Projects & Infrastructure</option>
                        <option value="Electric Power & Natural Gas">Electric Power & Natural Gas</option>
                        <option value="Retail Banking">Retail Banking</option>
                        <option value="Asset Management">Asset Management</option>
                        <option value="Wealth Management">Wealth Management</option>
                        <option value="Healthcare Systems & Services">Healthcare Systems & Services</option>
                        <option value="Medical Devices">Medical Devices</option>
                        <option value="Pharmaceuticals">Pharmaceuticals</option>
                        <option value="Biotechnology">Biotechnology</option>
                        <option value="High Tech & Semiconductors">High Tech & Semiconductors</option>
                        <option value="Media & Entertainment">Media & Entertainment</option>
                        <option value="Telecommunications">Telecommunications</option>
                        <option value="Metals & Mining">Metals & Mining</option>
                        <option value="Oil & Gas">Oil & Gas</option>
                        <option value="Pulp & Paper">Pulp & Paper</option>
                        <option value="National Security">National Security</option>
                        <option value="Public Sector Education">Public Sector Education</option>
                        <option value="Economic Development">Economic Development</option>
                        <option value="Global Health NGOs">Global Health NGOs</option>
                        <option value="Real Estate">Real Estate</option>
                        <option value="E-commerce">E-commerce</option>
                        <option value="Brick & Mortar Retail">Brick & Mortar Retail</option>
                        <option value="Apparel & Luxury Goods">Apparel & Luxury Goods</option>
                        <option value="Travel & Logistics">Travel & Logistics</option>
                        <option value="Hospitality">Hospitality</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Strategic Case Type</label>
                    <select id="type-select" class="w-full bg-white border border-gray-300 rounded p-2.5 text-sm font-medium text-gray-800 focus:ring-1 focus:ring-mckinsey-blue outline-none cursor-pointer">
                        <option value="Market Entry Strategy">Market Entry Strategy</option>
                        <option value="New Product/Service Launch">New Product/Service Launch</option>
                        <option value="Profitability Optimization (Revenue Side)">Profitability Optimization (Revenue Side)</option>
                        <option value="Profitability Optimization (Cost Side)">Profitability Optimization (Cost Side)</option>
                        <option value="M&A Due Diligence (Buy-Side)">M&A Due Diligence (Buy-Side)</option>
                        <option value="Post-Merger Operational Integration">Post-Merger Operational Integration</option>
                        <option value="Growth Strategy">Growth Strategy</option>
                        <option value="Digital Transformation & Automation">Digital Transformation & Automation</option>
                        <option value="Capital Investment/Asset Renewal Optimization">Capital Investment/Asset Renewal Optimization</option>
                        <option value="Supply Chain & Logistics Resilience">Supply Chain & Logistics Resilience</option>
                        <option value="Competitive Threat Response">Competitive Threat Response</option>
                        <option value="Regulatory/Tariff Compliance Strategy">Regulatory/Tariff Compliance Strategy</option>
                        <option value="Pricing & Monetization Optimization">Pricing & Monetization Optimization</option>
                        <option value="Sustainability/Decarbonization Transition">Sustainability/Decarbonization Transition</option>
                        <option value="Turnaround/Restructuring of Distressed Business">Turnaround/Restructuring of Distressed Business</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="executeCaseGenerationEngine()" class="w-full bg-mckinsey-blue hover:bg-blue-800 text-white font-semibold text-xs py-3 px-4 rounded shadow-sm transition duration-150 uppercase tracking-widest">
                        Generate Custom Case Model
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main id="workspace" class="max-w-5xl w-full mx-auto mt-8 px-4 mb-24 hidden">
        </main>

    <script>
        let globalChartInstance = null;

        function toggleAnswerContainer(id) {
            const content = document.getElementById(id);
            const indicator = document.getElementById('ind-' + id);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                indicator.innerHTML = '&#9662;';
            } else {
                content.classList.add('open');
                indicator.innerHTML = '&#9652;';
            }
        }

        function executeCaseGenerationEngine() {
            const industry = document.getElementById('industry-select').value;
            const caseType = document.getElementById('type-select').value;
            const workspace = document.getElementById('workspace');
            
            if (globalChartInstance) { 
                globalChartInstance.destroy(); 
                globalChartInstance = null;
            }
            
            workspace.classList.remove('hidden');
            const data = generateCasePayload(industry, caseType);
            
            workspace.innerHTML = `
                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="bg-mckinsey-navy text-white p-6 border-b border-gray-800">
                        <span class="text-xs font-bold uppercase tracking-widest text-mckinsey-blue block mb-1">${data.industry} | ${data.caseType}</span>
                        <h2 class="text-3xl font-bold tracking-tight">${data.brandName}</h2>
                    </div>
                    <div class="p-8 space-y-6">
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-mckinsey-navy mb-1">Client Goal</h3>
                            <p class="text-base font-semibold text-gray-900">${data.clientGoal}</p>
                        </div>
                        <hr class="border-gray-100" />
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-mckinsey-navy mb-2">Situation Description</h3>
                            <div class="text-sm text-gray-700 leading-relaxed space-y-4">
                                <p>${data.p1}</p>
                                <p>${data.p2}</p>
                                <p>${data.p3}</p>
                            </div>
                        </div>
                        <hr class="border-gray-100" />
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-mckinsey-navy mb-2">McKinsey Study</h3>
                            <div class="bg-slate-50 border-l-4 border-mckinsey-navy p-4 text-sm font-medium text-mckinsey-navy italic rounded-r">
                                ${data.mckinseyStudy}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mb-8">
                    <h2 class="text-xl font-bold text-gray-800 uppercase tracking-widest">Practice Case Questions</h2>
                    <div class="w-16 h-1 bg-mckinsey-blue mx-auto mt-3"></div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 1: Structuring</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-mckinsey-navy mb-6">${data.q1.prompt}</h3>
                        <button onclick="toggleAnswerContainer('ans-1')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50 transition bg-white shadow-sm">
                            <span>Reveal Ideal Answer Rubric</span>
                            <span id="ind-ans-1" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-1" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    ${data.q1.pillars.map(p => `
                                        <div>
                                            <h4 class="font-bold text-mckinsey-blue mb-2 border-b border-blue-100 pb-1">${p.title}</h4>
                                            <ul class="list-disc pl-4 space-y-1 text-xs text-slate-700">
                                                ${p.bullets.map(b => `<li>${b}</li>`).join('')}
                                            </ul>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 2: Quantitative Analysis</span>
                    </div>
                    <div class="p-8">
                        <div class="text-lg font-bold text-mckinsey-navy mb-4 space-y-3">${data.q2.prompt}</div>
                        <div class="mb-6 p-3 bg-blue-50 border border-blue-100 text-mckinsey-blue text-xs font-semibold rounded">
                            Helpful hint: Calculators are not allowed—you may want to write out your calculations on paper.
                        </div>
                        <button onclick="toggleAnswerContainer('ans-2')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50 transition bg-white shadow-sm">
                            <span>Reveal Calculation Steps</span>
                            <span id="ind-ans-2" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-2" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 space-y-4">
                                <ul class="list-decimal pl-5 space-y-2 text-sm text-slate-700">
                                    ${data.q2.steps.map(s => `<li>${s}</li>`).join('')}
                                </ul>
                                <div class="mt-4 p-4 bg-mckinsey-navy text-white font-bold rounded">
                                    ${data.q2.answer}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 3: Data Interpretation</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-mckinsey-navy mb-6">${data.q3.prompt}</h3>
                        <div class="w-full bg-white p-6 rounded border border-gray-200 shadow-inner mb-6">
                            <div class="w-full h-[380px] relative">
                                <canvas id="canvasRenderZone"></canvas>
                            </div>
                        </div>
                        <button onclick="toggleAnswerContainer('ans-3')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50 transition bg-white shadow-sm">
                            <span>Reveal Data Insights</span>
                            <span id="ind-ans-3" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-3" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 space-y-4">
                                <div><h4 class="font-bold text-red-600 mb-1">Red Herring Identified:</h4><p>${data.q3.redHerring}</p></div>
                                <div><h4 class="font-bold text-mckinsey-accent mb-1">Hidden Correlation:</h4><p>${data.q3.correlation}</p></div>
                                <div><h4 class="font-bold text-mckinsey-blue mb-1">Core Takeaway:</h4><p>${data.q3.takeaway}</p></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-slate-50/50">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Question 4: Strategic Pivot</span>
                    </div>
                    <div class="p-8">
                        <h3 class="text-lg font-bold text-mckinsey-navy mb-6">${data.q4.prompt}</h3>
                        <button onclick="toggleAnswerContainer('ans-4')" class="w-full flex justify-between items-center border border-gray-200 rounded p-4 text-sm font-semibold text-mckinsey-blue hover:bg-slate-50 transition bg-white shadow-sm">
                            <span>Reveal Brainstorming Strategy</span>
                            <span id="ind-ans-4" class="text-xs font-mono">&#9662;</span>
                        </button>
                        <div id="ans-4" class="reveal-content bg-white">
                            <div class="mt-4 border border-gray-100 bg-slate-50/40 rounded text-sm text-gray-700 space-y-6">
                                ${data.q4.rubric.map(r => `
                                    <div>
                                        <h4 class="font-bold text-mckinsey-navy uppercase tracking-wider text-xs mb-2 border-b pb-1">${r.theme}</h4>
                                        <ul class="list-disc pl-5 space-y-1 text-slate-700">
                                            ${r.bullets.map(b => `<li>${b}</li>`).join('')}
                                        </ul>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            renderDynamicChart(data.chart.type, data.chart.config);
            workspace.scrollIntoView({ behavior: 'smooth' });
        }

        // --- DYNAMIC MULTI-FORMAT CHART ENGINE ---
        function renderDynamicChart(type, config) {
            const ctx = document.getElementById('canvasRenderZone').getContext('2d');
            
            let chartJsConfig = {
                plugins: [{
                    beforeDraw: (chart) => {
                        const cCtx = chart.ctx;
                        cCtx.save();
                        cCtx.fillStyle = '#ffffff';
                        cCtx.fillRect(0, 0, chart.width, chart.height);
                        cCtx.restore();
                    }
                }],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: config.title, color: '#051c2c', font: { family: 'Inter', size: 14, weight: '700' }, padding: { bottom: 20 } },
                        legend: { display: true, position: 'bottom', labels: { font: { family: 'Inter', size: 11, weight: '500' }, color: '#334155' } }
                    }
                }
            };

            switch(type) {
                case 'waterfall':
                    chartJsConfig.type = 'bar';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { y: { title: { display: true, text: 'Variance Impact' } } };
                    break;
                case 'bubble':
                    chartJsConfig.type = 'bubble';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { x: { title: { display: true, text: config.xTitle } }, y: { title: { display: true, text: config.yTitle } } };
                    break;
                case 'inverted':
                    chartJsConfig.type = 'line';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { y: { reverse: true, title: { display: true, text: 'Regression Metric (Lower is Optimal)' } } };
                    break;
                case 'dualAxis':
                    chartJsConfig.type = 'bar';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { y: { position: 'left' }, y1: { position: 'right', grid: { drawOnChartArea: false } } };
                    break;
                case 'stackedBar100':
                    chartJsConfig.type = 'bar';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { x: { stacked: true }, y: { stacked: true, max: 100, title: { display: true, text: '% Distribution' } } };
                    break;
                case 'radar':
                    chartJsConfig.type = 'radar';
                    chartJsConfig.data = config.data;
                    break;
                case 'scatter':
                    chartJsConfig.type = 'scatter';
                    chartJsConfig.data = config.data;
                    chartJsConfig.options.scales = { x: { title: { display: true, text: config.xTitle } }, y: { title: { display: true, text: config.yTitle } } };
                    break;
                case 'stepline':
                    chartJsConfig.type = 'line';
                    config.data.datasets.forEach(ds => ds.stepped = true);
                    chartJsConfig.data = config.data;
                    break;
                case 'polarArea':
                    chartJsConfig.type = 'polarArea';
                    chartJsConfig.data = config.data;
                    break;
                case 'doughnut':
                    chartJsConfig.type = 'doughnut';
                    chartJsConfig.data = config.data;
                    break;
                case 'area':
                    chartJsConfig.type = 'line';
                    config.data.datasets.forEach(ds => ds.fill = true);
                    chartJsConfig.data = config.data;
                    break;
                case 'line':
                case 'bar':
                case 'groupedBar':
                    chartJsConfig.type = type === 'line' ? 'line' : 'bar';
                    chartJsConfig.data = config.data;
                    break;
                case 'mixed':
                    chartJsConfig.type = 'bar';
                    chartJsConfig.data = config.data;
                    break;
                default:
                    chartJsConfig.type = 'bar';
                    chartJsConfig.data = config.data;
            }

            globalChartInstance = new Chart(ctx, chartJsConfig);
        }

        // --- PROCEDURAL CASE ENGINE ---
        function generateCasePayload(industry, caseType) {
            // 1. BRANDING & DEMOGRAPHICS
            const prefixes = ['Aethel', 'Velo', 'Nexa', 'Terra', 'Omni', 'Quantum', 'Lumina', 'Aero', 'Zephyr', 'Synapse', 'Calyx', 'Valiant', 'Strata', 'Equinox', 'Pinnacle'];
            const suffixes = ['Corp', 'Strat', 'Pharma', 'Lumen', 'Systems', 'Dynamics', 'Logistics', 'Networks', 'Tech', 'Holdings', 'Industries', 'Solutions', 'Global'];
            const brandName = prefixes[Math.floor(Math.random() * prefixes.length)] + suffixes[Math.floor(Math.random() * suffixes.length)];

            // 2. TIMELINES & METRICS
            const timelines = ['9 months', '14 weeks', '3 quarters', '18 months', 'the next fiscal half', '120 days'];
            const metricsList = ['EBITDA margin degradation', 'logistics yield constraints', 'customer acquisition cost inflation', 'supply chain capacity ceilings', 'operating expenditure burn rate'];
            const randomMetric = metricsList[Math.floor(Math.random() * metricsList.length)];
            const randomVar = [14, 18, 22, 35, 40][Math.floor(Math.random() * 5)];
            const bigNumber = [150, 400, 850, 1200][Math.floor(Math.random() * 4)];
            
            // 3. THEMATIC PATHWAY ENGINE
            const themes = [
                { id: 'TCO', name: 'Total Cost of Ownership', chartX: 'Region', chartY: 'Procurement Cost' },
                { id: 'NPV', name: 'Net Present Value', chartX: 'Time (Years)', chartY: 'Cash Flow Yield' },
                { id: 'BOT', name: 'Capacity Bottlenecks', chartX: 'Node', chartY: 'Throughput Yield %' },
                { id: 'DEF', name: 'Defensive Thresholds', chartX: 'Competitor', chartY: 'Subscriber Acquisition Cost (SAC)' }
            ];
            const theme = themes[Math.floor(Math.random() * themes.length)];

            // Paragraph 1: Scale, Strengths, Vulnerabilities
            const p1_scales = [`a massive, $${bigNumber} billion global enterprise`, `an agile, rapid-growth insurgent holding a $${bigNumber}M capitalization`, `a legacy market leader processing $${bigNumber}M in annual throughput`];
            const p1_strengths = [`possessing an unmatched, highly defensible intellectual property portfolio`, `leveraging an incredibly dense, multi-continent physical asset footprint`, `historically commanding top-quartile pricing power`];
            const p1_vulns = [`However, they are deeply burdened by an inflexible legacy management structure.`, `Yet, their technological infrastructure relies on decaying, on-premise silos.`, `Unfortunately, they are highly exposed to single-point vendor dependencies.`];
            const p1 = `${brandName} is ${p1_scales[Math.floor(Math.random() * 3)]} within the ${industry} space. Recognized for ${p1_strengths[Math.floor(Math.random() * 3)]}. ${p1_vulns[Math.floor(Math.random() * 3)]}`;

            // Paragraph 2: Unit Economics (Tied to theme)
            let p2 = "";
            if (theme.id === 'TCO') p2 = `The company's unit economics revolve around a massive cross-border sourcing network. They procure raw inputs from emerging markets, assembling them in near-shore facilities to minimize labor expenditures, before distributing via third-party freight.`;
            else if (theme.id === 'NPV') p2 = `Their financial model is driven by heavy, upfront capital expenditures (CapEx) requiring strict 5-to-7 year depreciation schedules. Profitability dictates that these high-cost assets run at 90%+ utilization rates continuously.`;
            else if (theme.id === 'BOT') p2 = `Operationally, they run a tightly coupled 'just-in-time' manufacturing ecosystem. Output relies entirely on the synchronized throughput of specialized, sequential production nodes operating with virtually zero inventory buffer.`;
            else p2 = `Commercially, they rely on a high-volume, low-margin subscription architecture. Growth is sustained only by aggressively optimizing their customer lifetime value (LTV) against an ever-increasing cost to acquire users across digital channels.`;

            // Paragraph 3: The Complication
            const comps = [
                `a sudden, localized protectionist tariff policy that immediately penalizes cross-border transit routes`,
                `a rapid, unpredicted consumer migration to open-source digital alternatives, cannibalizing their core high-margin offering`,
                `a catastrophic failure in a tier-2 supplier node that has fragmented their entire downstream distribution network`,
                `an aggressive, low-cost international competitor initiating a brutal price war in their most profitable domestic territory`
            ];
            const complication = comps[Math.floor(Math.random() * 4)];
            const p3 = `Recently, the ecosystem was shocked by ${complication}. This macro disruption has structurally broken their historical workflow, paralyzing capital flow and severely jeopardizing their market positioning.`;

            const sponsors = ['Chief Risk Officer', 'Head of Global Supply Chain', 'VP of Strategic Finance', 'Chief Operating Officer'];
            const sponsor = sponsors[Math.floor(Math.random() * 4)];

            // 4. MATH ENGINE & THEMATIC QUESTIONS
            let mathObj = {};
            let chartLabels = [];
            let q3_redHerring = "";
            let q3_correlation = "";

            if (theme.id === 'TCO') {
                const labor = Math.floor(Math.random() * 3 + 2) * 100; // 200, 300, 400
                const reduction = [25, 30, 40][Math.floor(Math.random() * 3)];
                const tariff = Math.floor(Math.random() * 3 + 4) * 10; // 40, 50, 60
                const savings = labor * (reduction / 100);
                const net = savings - tariff;
                mathObj = {
                    prompt: `<p>To navigate the disruption, the client is evaluating shifting operations entirely. They currently spend $${labor} Million annually on legacy labor. Moving to an automated near-shore facility will cut labor costs by exactly ${reduction}%.</p><p>However, this triggers new regional compliance tariffs totaling a flat $${tariff} Million annually. What is the precise net financial outcome of this transition?</p>`,
                    steps: [
                        `Calculate absolute labor savings: $${labor}M &times; 0.${reduction} = $${savings}M.`,
                        `Compare total savings against the new flat tariff penalty: $${savings}M vs $${tariff}M.`,
                        `Deduct the tariff from the savings to isolate the net financial variance.`
                    ],
                    answer: `${net > 0 ? 'Positive Net Yield' : 'Negative Net Loss'} of $${Math.abs(net)} Million annually.`
                };
                chartLabels = ['Logistics', 'Procurement', 'Labor', 'Tariffs', 'Overhead'];
                q3_redHerring = "The 'Procurement Cost' spike looks terrifying, but it is heavily subsidized by long-term forward contracts.";
                q3_correlation = "The true bottleneck correlates perfectly with 'Logistics Delay Days' intersecting with sudden tariff clearance holds.";
            } else if (theme.id === 'BOT') {
                const cap = Math.floor(Math.random() * 4 + 5) * 100; // 500 to 800
                const demand = cap + (Math.floor(Math.random() * 3 + 2) * 100); // Exceeds cap
                const gap = demand - cap;
                const nodeOutput = gap / 2;
                mathObj = {
                    prompt: `<p>The disruption has created a massive fulfillment backlog. Total forecasted demand is ${demand} Million units, but the legacy network is hard-capped at a maximum throughput of ${cap} Million units.</p><p>The engineering team can retrofit "Node Epsilon," which currently outputs ${nodeOutput} Million units. By exactly what percentage must Node Epsilon's throughput increase to single-handedly clear the entire network shortfall?</p>`,
                    steps: [
                        `Calculate the absolute network shortfall: ${demand}M demand &minus; ${cap}M capacity = ${gap}M units.`,
                        `Identify the baseline target: Node Epsilon processes ${nodeOutput}M units.`,
                        `Calculate required scaling factor: (${gap}M shortfall / ${nodeOutput}M base) &times; 100.`
                    ],
                    answer: `Exactly ${(gap/nodeOutput)*100}% Output Increase Required.`
                };
                chartLabels = ['Node A', 'Node B', 'Node C', 'Node D', 'Node Epsilon'];
                q3_redHerring = "The 'Defect Rate' at Node C appears highly volatile, but it only impacts 4% of total network volume.";
                q3_correlation = "The hidden failure point is the 'Throughput Yield %' crashing specifically when machine utilization breaches 85% capacity limits.";
            } else if (theme.id === 'NPV') {
                const capex = Math.floor(Math.random() * 4 + 2) * 100; // 200, 300, 400
                const rev = Math.floor(Math.random() * 3 + 2) * 50; // 100, 150
                const cost = 25;
                const netYield = rev - cost;
                mathObj = {
                    prompt: `<p>The proposed digital transformation requires an immediate, non-depreciable CapEx injection of $${capex} Million. Once live, the new infrastructure will generate $${rev} Million in fresh annual revenue.</p><p>However, it requires a strict $${cost} Million annual maintenance contract. Assuming a 0% discount rate for simplicity, in exactly how many years will this project hit its break-even payback period?</p>`,
                    steps: [
                        `Determine net annual cash flow: $${rev}M new revenue &minus; $${cost}M maintenance = $${netYield}M/year.`,
                        `Apply payback formula: Total Fixed CapEx / Net Annual Cash Flow.`,
                        `Calculate: $${capex}M / $${netYield}M.`
                    ],
                    answer: `Exactly ${capex / netYield} Years to Break-Even.`
                };
                chartLabels = ['Year 1', 'Year 2', 'Year 3', 'Year 4', 'Year 5'];
                q3_redHerring = "The 'Gross Implementation Spend' in Year 1 looks like a massive budget overrun, but it includes pre-approved amortized software licenses.";
                q3_correlation = "The 'Cash Flow Yield' plummets in Year 3 exactly when legacy hardware warranties expire simultaneously.";
            } else {
                const market = Math.floor(Math.random() * 3 + 2) * 1000; // 2000, 3000
                const targetPct = [15, 20, 25][Math.floor(Math.random() * 3)];
                const reqValue = market * (targetPct / 100);
                const ltv = 500;
                mathObj = {
                    prompt: `<p>To survive the competitor's price war, the client must hold exactly ${targetPct}% defensive market share. The total regional market capitalization is fixed at $${market} Million.</p><p>If the client's average customer lifetime value (LTV) is tightly modeled at $${ltv}, exactly how many active paying subscribers must they maintain to successfully hit their defensive revenue threshold?</p>`,
                    steps: [
                        `Calculate the absolute defensive revenue threshold: $${market}M &times; 0.${targetPct} = $${reqValue}M.`,
                        `Divide the revenue threshold by the individual unit economics: $${reqValue}M / $${ltv} LTV.`,
                        `Translate millions cleanly into absolute user metrics.`
                    ],
                    answer: `${(reqValue * 1000000 / ltv).toLocaleString()} Active Subscribers Required.`
                };
                chartLabels = ['Segment X', 'Segment Y', 'Segment Z', 'Enterprise', 'SMB'];
                q3_redHerring = "The 'Subscriber Acquisition Cost (SAC)' in the SMB segment is skyrocketing, but their LTV is so high it remains highly profitable.";
                q3_correlation = "The actual margin destruction is hiding in 'Segment Y', where aggressive discounting failed to reduce churn, destroying the LTV/CAC ratio.";
            }

            // 5. CHART.JS DATA ENGINE (15 Types safely handled)
            const chartTypesPool = ['bubble', 'inverted', 'waterfall', 'dualAxis', 'stackedBar100', 'radar', 'scatter', 'stepline', 'polarArea', 'doughnut', 'line', 'bar', 'groupedBar', 'mixed', 'area'];
            const selectedChart = chartTypesPool[Math.floor(Math.random() * chartTypesPool.length)];

            // Generate safe baseline data
            let d1 = [40, 60, 30, 80, 50];
            let d2 = [20, 30, 15, 40, 25];

            let cConfig = {
                title: `${theme.name} Analytical Exhibit`,
                xTitle: theme.chartX,
                yTitle: theme.chartY,
                data: {
                    labels: chartLabels,
                    datasets: [
                        { label: 'Primary Operating Metric', data: d1, backgroundColor: '#051c2c', borderColor: '#051c2c' }
                    ]
                }
            };

            // Format data structures specifically so Chart.js doesn't crash on complex layouts
            if (selectedChart === 'waterfall') {
                cConfig.data.datasets[0].data = [[0, 300], [300, 450], [400, 450], [400, 520], [0, 520]];
                cConfig.data.datasets[0].backgroundColor = ['#051c2c', '#005f9e', '#e06b20', '#005f9e', '#051c2c'];
            } else if (selectedChart === 'bubble') {
                cConfig.data.datasets = [
                    { label: 'Core Segments', data: [{ x: 15, y: 30, r: 10 }, { x: 45, y: 60, r: 25 }, { x: 75, y: 50, r: 15 }], backgroundColor: '#005f9e' },
                    { label: 'Emerging Risks', data: [{ x: 20, y: 80, r: 12 }, { x: 60, y: 20, r: 20 }], backgroundColor: '#e06b20' }
                ];
            } else if (selectedChart === 'scatter') {
                cConfig.data.datasets[0].data = [{ x: 10, y: 20 }, { x: 30, y: 40 }, { x: 50, y: 30 }, { x: 70, y: 80 }, { x: 90, y: 60 }];
            } else if (selectedChart === 'stackedBar100' || selectedChart === 'groupedBar') {
                cConfig.data.datasets.push({ label: 'Secondary Variable', data: d2, backgroundColor: '#005f9e' });
                cConfig.data.datasets.push({ label: 'Tertiary Impact', data: [15, 25, 35, 10, 20], backgroundColor: '#94a3b8' });
            } else if (selectedChart === 'dualAxis' || selectedChart === 'mixed') {
                cConfig.data.datasets[0].type = 'bar';
                cConfig.data.datasets.push({ type: 'line', label: 'Margin Yield %', data: [12, 18, 14, 22, 19], borderColor: '#e06b20', yAxisID: 'y1' });
            } else if (selectedChart === 'doughnut' || selectedChart === 'polarArea') {
                cConfig.data.datasets[0].backgroundColor = ['#051c2c', '#005f9e', '#e06b20', '#475569', '#94a3b8'];
            }

            // 6. ASSEMBLE FINAL JSON PAYLOAD
            return {
                brandName: brandName,
                industry: industry,
                caseType: caseType,
                clientGoal: `Reverse a ${randomVar}% ${randomMetric} threshold strictly within ${timelines[Math.floor(Math.random() * timelines.length)]}.`,
                p1: p1,
                p2: p2,
                p3: p3,
                mckinseyStudy: `The ${sponsor} has explicitly engaged McKinsey to diagnose the financial root causes of this disruption and execute an immediate stabilization framework.`,
                q1: {
                    prompt: `Given the explicit constraints triggered by the disruption, what specific operational trade-offs and financial structures must the team investigate?`,
                    pillars: [
                        { title: "Financial & Asset Liquidity", bullets: ["Immediate capital expenditure requirements.", "Depreciation schedules of stranded assets.", "Real estate and leasing liabilities."] },
                        { title: "Operational Execution Logistics", bullets: ["Supplier concentration risk profiles.", "Cost impacts of newly imposed transit delays.", "Working capital requirements to buffer delays."] },
                        { title: "Market Positioning Dynamics", bullets: ["Customer acquisition cost (CAC) inflation.", "Price elasticity against agile disruptors.", "Contractual lock-in rates for enterprise clients."] }
                    ]
                },
                q2: {
                    prompt: mathObj.prompt,
                    steps: mathObj.steps,
                    answer: mathObj.answer
                },
                q3: {
                    prompt: `Our data architects mapped the client's internal telemetry across the affected ${theme.chartX}s. Analyze the visual exhibit below. What underlying operational breakdown is occurring?`,
                    redHerring: q3_redHerring,
                    correlation: q3_correlation,
                    takeaway: `The data definitively proves that the client's failure is structural, not commercial. Capital must be immediately reallocated to resolve the ${theme.chartY} bottleneck before scaling further.`
                },
                q4: {
                    prompt: `The ${sponsor} pushes back immediately: "If we execute this transition, we risk catastrophic operational downtime that will permanently alienate our highest-margin legacy clients." How do we mitigate this downstream threat?`,
                    rubric: [
                        { theme: "Operational Ring-Fencing", bullets: ["Establish a dedicated 'White Glove' fulfillment track entirely separated from the transition systems.", "Pre-build an artificial 90-day inventory buffer for legacy accounts prior to cutover."] },
                        { theme: "Financial Hedging", bullets: ["Proactively restructure SLA contracts with temporary price concessions in exchange for transition grace periods.", "Utilize external vendor performance bonds to shift financial liability off the balance sheet."] },
                        { theme: "Governance & Rollback", bullets: ["Deploy a localized 'War Room' executive integration team embedded within top-tier accounts.", "Implement a strict 'Stage-Gate' rollback protocol if defect rates breach 1.5%."] }
                    ]
                },
                chart: {
                    type: selectedChart,
                    config: cConfig
                }
            };
        }
    </script>
</body>
</html>
